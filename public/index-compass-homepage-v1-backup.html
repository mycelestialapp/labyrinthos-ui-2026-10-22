<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 上线主版本。快照：compass-perfect-snapshot.html（当前满意版）。无呼吸旧版：compass-best-archive.html -->
  <title>宇宙罗盘 · 附魔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .stage {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    /**
     * 随 iframe / 窗口变化：用父级 100% 与 vmin 取小，保证正方形且始终落在可视区内。
     * 避免写死 96vw 导致在缩放、窄栏、横竖屏切换时「尺寸不跟手」。
     */
    #compass-container {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: min(100%, 94vmin);
      max-width: 100%;
      aspect-ratio: 1;
      height: auto;
      max-height: 100%;
      flex: 0 1 auto;
      background: transparent;
      cursor: pointer;
      transform-origin: 50% 50%;
    }
    #compass-container:focus-visible {
      outline: 1px solid rgba(255, 215, 120, 0.55);
      outline-offset: 6px;
      border-radius: 4px;
    }
    #compass-container svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    /* 神圣光晕：CSS + SVG filter 双叠 */
    .hub-divine {
      filter:
        drop-shadow(0 0 8px rgba(255, 237, 160, 0.95))
        drop-shadow(0 0 22px rgba(255, 215, 0, 0.9))
        drop-shadow(0 0 48px rgba(255, 190, 70, 0.55))
        drop-shadow(0 0 72px rgba(200, 140, 40, 0.25));
    }
    #particle-canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="stage">
    <div id="compass-container" tabindex="0" role="button" aria-label="轻触罗盘中心启阵">
      <svg id="compass-svg" viewBox="-500 -500 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="宇宙罗盘">
        <defs>
          <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3d2a08" />
            <stop offset="18%" stop-color="#8b6914" />
            <stop offset="38%" stop-color="#c9a227" />
            <stop offset="52%" stop-color="#e6c040" />
            <stop offset="62%" stop-color="#fff2c8" />
            <stop offset="72%" stop-color="#e8c547" />
            <stop offset="88%" stop-color="#b8860b" />
            <stop offset="100%" stop-color="#4a3c10" />
          </linearGradient>
          <linearGradient id="goldMetal2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a1f06" />
            <stop offset="25%" stop-color="#8b7500" />
            <stop offset="50%" stop-color="#d4a82a" />
            <stop offset="78%" stop-color="#daa520" />
            <stop offset="100%" stop-color="#5c4a12" />
          </linearGradient>
          <linearGradient id="goldStroke" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#6b5210" />
            <stop offset="35%" stop-color="#d4af37" />
            <stop offset="55%" stop-color="#fff8e8" />
            <stop offset="100%" stop-color="#8b6914" />
          </linearGradient>
          <radialGradient id="hubGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#fffef0" />
            <stop offset="25%" stop-color="#ffe566" />
            <stop offset="55%" stop-color="#c9a010" />
            <stop offset="100%" stop-color="#4a3a08" />
          </radialGradient>
          <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff8dc" />
            <stop offset="40%" stop-color="#e8c547" />
            <stop offset="100%" stop-color="#b8860b" />
          </linearGradient>
          <linearGradient id="needleSilver" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e8e0d0" />
            <stop offset="35%" stop-color="#fffef8" />
            <stop offset="50%" stop-color="#e8d080" />
            <stop offset="70%" stop-color="#c9b896" />
            <stop offset="100%" stop-color="#8a8070" />
          </linearGradient>
          <linearGradient id="needleShadow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5a5048" />
            <stop offset="50%" stop-color="#a89880" />
            <stop offset="100%" stop-color="#d8ccb8" />
          </linearGradient>
          <filter id="letterGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b" />
            <feFlood flood-color="#ffd700" flood-opacity="0.55" result="f" />
            <feComposite in="f" in2="b" operator="in" result="g" />
            <feMerge>
              <feMergeNode in="g" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="softBloom" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="divineHubDrop" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur1" />
            <feFlood flood-color="#FFD700" flood-opacity="0.75" result="gold1" />
            <feComposite in="gold1" in2="blur1" operator="in" result="glow1" />
            <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur2" />
            <feFlood flood-color="#ffcc55" flood-opacity="0.35" result="gold2" />
            <feComposite in="gold2" in2="blur2" operator="in" result="glow2" />
            <feMerge>
              <feMergeNode in="glow2" />
              <feMergeNode in="glow1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <g id="sunburst-group" fill="none" stroke="url(#goldStroke)" stroke-width="0.35" opacity="0.92"></g>

        <g id="outer-decoration">
          <circle cx="0" cy="0" r="472" fill="none" stroke="url(#goldMetal)" stroke-width="2.2" opacity="0.95" />
          <circle cx="0" cy="0" r="468" fill="none" stroke="url(#goldMetal2)" stroke-width="0.6" opacity="0.7" />
          <circle cx="0" cy="-472" r="7" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.8" />
          <circle cx="0" cy="472" r="7" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.8" />
          <circle cx="472" cy="0" r="7" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.8" />
          <circle cx="-472" cy="0" r="7" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.8" />
          <circle cx="334" cy="-334" r="5" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.5" opacity="0.9" />
          <circle cx="334" cy="334" r="5" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.5" opacity="0.9" />
          <circle cx="-334" cy="334" r="5" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.5" opacity="0.9" />
          <circle cx="-334" cy="-334" r="5" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="0.5" opacity="0.9" />
        </g>

        <circle cx="0" cy="0" r="398" fill="none" stroke="url(#goldMetal)" stroke-width="1.4" />
        <circle cx="0" cy="0" r="385" fill="none" stroke="url(#goldMetal2)" stroke-width="3" stroke-dasharray="0 10.2" stroke-linecap="round" opacity="0.92" />

        <g id="star-rose"></g>

        <text x="0" y="-408" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="56" font-weight="700" fill="url(#textGold)" filter="url(#letterGlow)">N</text>
        <text x="0" y="458" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="52" font-weight="700" fill="url(#textGold)" filter="url(#letterGlow)">S</text>
        <text x="434" y="0" dominant-baseline="central" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="52" font-weight="700" fill="url(#textGold)" filter="url(#letterGlow)">E</text>
        <text x="-434" y="0" dominant-baseline="central" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="52" font-weight="700" fill="url(#textGold)" filter="url(#letterGlow)">W</text>

        <g id="tap-pulse-layer" pointer-events="none">
          <circle id="tap-pulse-halo" cx="0" cy="0" r="40" fill="none" stroke="#ffcc33" stroke-width="6" stroke-linecap="round" opacity="0" />
          <circle id="tap-pulse-ring" cx="0" cy="0" r="44" fill="none" stroke="#ffaa00" stroke-width="3.2" stroke-linecap="round" opacity="0" />
        </g>

        <g id="pointer-layer">
          <polygon points="0,-125 -10,-28 10,-28" fill="url(#needleShadow)" opacity="0.95" />
          <polygon points="0,-128 -7,-28 7,-28" fill="url(#needleSilver)" />
          <line x1="0" y1="-28" x2="0" y2="-8" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
        </g>

        <g id="breath-hub">
          <circle id="hub-aura-breathe" cx="0" cy="0" r="58" fill="#ffd700" opacity="0.09" filter="url(#softBloom)" />
          <circle class="hub-divine" cx="0" cy="0" r="38" fill="url(#hubGrad)" stroke="url(#goldStroke)" stroke-width="1.6" filter="url(#divineHubDrop)" />
          <circle class="hub-divine" cx="0" cy="0" r="22" fill="url(#hubGrad)" opacity="0.9" filter="url(#softBloom)" />
        </g>
      </svg>
    </div>
  </div>

  <script>
(function () {
  'use strict';
  if (typeof gsap === 'undefined') {
    document.body.innerHTML = '<p style="color:#c88;padding:24px;">GSAP CDN 未加载</p>';
    return;
  }
  if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<p style="color:#c88;padding:24px;">Three.js CDN 未加载</p>';
    return;
  }

  var NS = 'http://www.w3.org/2000/svg';
  var sunburst = document.getElementById('sunburst-group');
  var starRose = document.getElementById('star-rose');
  var svg = document.getElementById('compass-svg');
  var n = 360;
  var i;
  var rIn = 378;
  var rOut = 498;
  for (i = 0; i < n; i++) {
    var a = (i * Math.PI * 2) / n;
    var major = i % 4 === 0;
    var sub = i % 12 === 0 ? 1 : i % 3 === 0 ? 0.78 : 0.52;
    var len = (major ? 1 : 0.72) * sub;
    var r1 = rIn + (rOut - rIn) * 0.08;
    var r2 = rIn + (rOut - rIn) * (0.08 + len * 0.9);
    var x1 = Math.sin(a) * r1;
    var y1 = -Math.cos(a) * r1;
    var x2 = Math.sin(a) * r2;
    var y2 = -Math.cos(a) * r2;
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x1.toFixed(3));
    line.setAttribute('y1', y1.toFixed(3));
    line.setAttribute('x2', x2.toFixed(3));
    line.setAttribute('y2', y2.toFixed(3));
    line.setAttribute('opacity', major ? '1' : '0.72');
    sunburst.appendChild(line);
  }

  var innerR = 44;
  var longOut = 310;
  var shortOut = 220;
  for (i = 0; i < 16; i++) {
    var ang = i * 22.5;
    var cardinal = i % 4 === 0;
    var outer = cardinal ? longOut : shortOut;
    var hw = cardinal ? 4.2 : 3.2;
    var pathL = document.createElementNS(NS, 'path');
    var pathR = document.createElementNS(NS, 'path');
    var aL0 = ang - hw * 0.5;
    var aL1 = ang;
    var aR0 = ang;
    var aR1 = ang + hw * 0.5;
    function wedge(a0, a1, outR) {
      var r0 = (a0 * Math.PI) / 180;
      var r1 = (a1 * Math.PI) / 180;
      var x0 = Math.sin(r0) * innerR;
      var y0 = -Math.cos(r0) * innerR;
      var x1 = Math.sin(r1) * innerR;
      var y1 = -Math.cos(r1) * innerR;
      var x2 = Math.sin(r1) * outR;
      var y2 = -Math.cos(r1) * outR;
      var x3 = Math.sin(r0) * outR;
      var y3 = -Math.cos(r0) * outR;
      return 'M ' + x0 + ',' + y0 + ' L ' + x3 + ',' + y3 + ' L ' + x2 + ',' + y2 + ' L ' + x1 + ',' + y1 + ' Z';
    }
    pathL.setAttribute('d', wedge(aL0, aL1, outer));
    pathL.setAttribute('fill', 'url(#goldMetal2)');
    pathL.setAttribute('opacity', cardinal ? '0.95' : '0.9');
    pathR.setAttribute('d', wedge(aR0, aR1, outer));
    pathR.setAttribute('fill', 'url(#goldMetal)');
    pathR.setAttribute('opacity', cardinal ? '0.98' : '0.92');
    pathL.setAttribute('stroke', 'url(#goldStroke)');
    pathR.setAttribute('stroke', 'url(#goldStroke)');
    pathL.setAttribute('stroke-width', '0.35');
    pathR.setAttribute('stroke-width', '0.35');
    starRose.appendChild(pathL);
    starRose.appendChild(pathR);
  }

  /** 极缓慢「呼吸」：中心金球 + 放射星芒（缩放错频 + 光晕透明度脉动） */
  (function initBreathing() {
    var hub = document.getElementById('breath-hub');
    var aura = document.getElementById('hub-aura-breathe');
    if (!hub || !starRose) return;
    gsap.set([hub, starRose], { transformOrigin: '50% 50%' });
    gsap.to(hub, {
      scale: 1.058,
      duration: 6.8,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true,
    });
    gsap.to(aura, {
      opacity: 0.34,
      duration: 4.8,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true,
      delay: 0.6,
    });
    gsap.to(starRose, {
      scale: 1.04,
      duration: 8.6,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true,
    });
    var ring = document.getElementById('tap-pulse-ring');
    var halo = document.getElementById('tap-pulse-halo');
    if (ring && halo) {
      var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });
      tl.fromTo(
        halo,
        { attr: { r: 32 }, opacity: 0.45 },
        { attr: { r: 188 }, opacity: 0, duration: 2.85, ease: 'power1.out' },
        0
      ).fromTo(
        ring,
        { attr: { r: 36 }, opacity: 0.78 },
        { attr: { r: 176 }, opacity: 0, duration: 2.85, ease: 'power1.out' },
        0
      );
    }
  })();

  var container = document.getElementById('compass-container');
  var canvas = document.getElementById('particle-canvas');
  var spinning = false;
  var dissolving = false;
  var extraRot = 0;

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  camera.position.set(0, 0, 26);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  var scene3 = new THREE.Scene();
  var particlePoints = null;
  var particleVel = null;
  var particleGeom = null;
  var particleMat = null;
  var rafId = 0;

  function updateCameraFOV() {
    var w = window.innerWidth;
    var h = Math.max(window.innerHeight, 1);
    camera.aspect = w / h;
    /** 竖屏略抬 FOV，横屏略压，保证罗盘区在视锥内舒适 */
    camera.fov = h > w ? 50 : 40;
    camera.updateProjectionMatrix();
  }

  function resizeThree() {
    var w = window.innerWidth;
    var h = Math.max(window.innerHeight, 1);
    updateCameraFOV();
    renderer.setSize(w, h);
  }

  function svgUserToWorld(sx, sy) {
    var pt = svg.createSVGPoint();
    pt.x = sx;
    pt.y = sy;
    var scr = pt.matrixTransform(svg.getScreenCTM());
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var ndcX = (scr.x / vw) * 2 - 1;
    var ndcY = -(scr.y / vh) * 2 + 1;
    var v = new THREE.Vector3(ndcX, ndcY, 0.5);
    v.unproject(camera);
    var dir = v.sub(camera.position).normalize();
    var t = -camera.position.z / dir.z;
    var p = camera.position.clone().add(dir.multiplyScalar(t));
    return p;
  }

  function collectSamplePoints(targetN) {
    var raw = [];
    function add(x, y) {
      raw.push({ x: x, y: y });
    }

    svg.querySelectorAll('path').forEach(function (path) {
      try {
        var len = path.getTotalLength();
        if (!len || !isFinite(len)) return;
        var steps = Math.max(6, Math.ceil(len / 3));
        var j;
        for (j = 0; j <= steps; j++) {
          var p = path.getPointAtLength((len * j) / steps);
          add(p.x, p.y);
        }
      } catch (e) {}
    });

    svg.querySelectorAll('line').forEach(function (l) {
      var x1 = parseFloat(l.getAttribute('x1'));
      var y1 = parseFloat(l.getAttribute('y1'));
      var x2 = parseFloat(l.getAttribute('x2'));
      var y2 = parseFloat(l.getAttribute('y2'));
      var t;
      for (t = 0; t <= 1.001; t += 0.2) add(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
    });

    svg.querySelectorAll('circle').forEach(function (c) {
      var cx = parseFloat(c.getAttribute('cx'));
      var cy = parseFloat(c.getAttribute('cy'));
      var r = parseFloat(c.getAttribute('r')) || 0;
      var a;
      for (a = 0; a < Math.PI * 2; a += Math.PI / 10) add(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    });

    svg.querySelectorAll('polygon').forEach(function (poly) {
      var nums = poly.getAttribute('points').trim().split(/[\s,]+/).map(parseFloat);
      var k;
      for (k = 0; k + 1 < nums.length; k += 2) add(nums[k], nums[k + 1]);
    });

    svg.querySelectorAll('text').forEach(function (t) {
      try {
        var b = t.getBBox();
        add(b.x + b.width * 0.5, b.y + b.height * 0.5);
        add(b.x, b.y);
        add(b.x + b.width, b.y + b.height);
      } catch (e) {}
    });

    if (raw.length === 0) {
      add(0, 0);
      add(120, 0);
      add(-120, 0);
    }

    var outPos = [];
    var outVel = [];
    var idx;
    for (idx = 0; idx < targetN; idx++) {
      var s = raw[idx % raw.length];
      var jx = (Math.random() - 0.5) * 6;
      var jy = (Math.random() - 0.5) * 6;
      var wv = svgUserToWorld(s.x + jx, s.y + jy);
      outPos.push(wv.x, wv.y, wv.z + (Math.random() - 0.5) * 0.08);
      var ang = Math.random() * Math.PI * 2;
      var sp = 0.04 + Math.random() * 0.12;
      outVel.push(Math.cos(ang) * sp, Math.sin(ang) * sp * 0.35 + 0.02, (Math.random() - 0.5) * 0.04);
    }
    return { pos: new Float32Array(outPos), vel: new Float32Array(outVel) };
  }

  function disposeParticles() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    if (particlePoints) {
      scene3.remove(particlePoints);
      if (particleGeom) particleGeom.dispose();
      if (particleMat) particleMat.dispose();
      particlePoints = null;
      particleGeom = null;
      particleMat = null;
      particleVel = null;
    }
    canvas.style.display = 'none';
  }

  function runDissolve() {
    dissolving = true;
    resizeThree();
    var pack = collectSamplePoints(7200);
    particleVel = pack.vel;
    particleGeom = new THREE.BufferGeometry();
    particleGeom.setAttribute('position', new THREE.BufferAttribute(pack.pos, 3));
    particleMat = new THREE.PointsMaterial({
      color: 0xffd278,
      size: 0.09,
      transparent: true,
      opacity: 1,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    particlePoints = new THREE.Points(particleGeom, particleMat);
    scene3.add(particlePoints);

    canvas.style.display = 'block';

    var proxy = { t: 0 };
    var lastT = performance.now();
    gsap.to(proxy, {
      t: 1,
      duration: 2.6,
      ease: 'power1.out',
      onUpdate: function () {
        var now = performance.now();
        var dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        var t = proxy.t;
        var arr = particleGeom.attributes.position.array;
        var v = particleVel;
        var k;
        var drift = (0.55 + t * 0.85) * dt * 60;
        for (k = 0; k < arr.length; k += 3) {
          arr[k] += v[k] * drift;
          arr[k + 1] += v[k + 1] * drift;
          arr[k + 2] += v[k + 2] * drift;
        }
        particleGeom.attributes.position.needsUpdate = true;
        particleMat.opacity = 1 - t;
        particleMat.size = 0.09 * (1 - t * 0.92);
      },
      onComplete: function () {
        disposeParticles();
        gsap.set(container, { rotation: 0, opacity: 1 });
        extraRot = 0;
        dissolving = false;
        spinning = false;
      },
    });

    function loop() {
      rafId = requestAnimationFrame(loop);
      renderer.render(scene3, camera);
    }
    loop();
  }

  /** 靠近中心自动启阵：需先移出外圈再移入内圈，避免误触连发 */
  var wasOutsideProximity = true;

  function spin() {
    if (spinning || dissolving) return;
    wasOutsideProximity = false;
    spinning = true;
    var turns = 3 + Math.floor(Math.random() * 4);
    extraRot += turns * 360 + Math.random() * 40;
    gsap.to(container, {
      rotation: extraRot,
      duration: 2.8 + Math.random() * 0.8,
      ease: 'power2.inOut',
      onComplete: function () {
        gsap.to(container, {
          opacity: 0,
          duration: 0.35,
          ease: 'power2.in',
          onComplete: function () {
            runDissolve();
          },
        });
      },
    });
  }

  function pointerDistSq(clientX, clientY, rect) {
    var cx = rect.left + rect.width * 0.5;
    var cy = rect.top + rect.height * 0.5;
    var dx = clientX - cx;
    var dy = clientY - cy;
    return dx * dx + dy * dy;
  }

  container.addEventListener('pointermove', function (e) {
    if (spinning || dissolving) return;
    if (e.pointerType === 'touch') return;
    var rect = container.getBoundingClientRect();
    var w = rect.width;
    var d2 = pointerDistSq(e.clientX, e.clientY, rect);
    var rIn = w * 0.4;
    var rOut = w * 0.48;
    var insideIn = d2 <= rIn * rIn;
    var outsideOut = d2 > rOut * rOut;
    if (outsideOut) wasOutsideProximity = true;
    else if (wasOutsideProximity && insideIn) {
      spin();
    }
  });

  container.addEventListener('pointerleave', function () {
    wasOutsideProximity = true;
  });

  container.addEventListener('click', function (e) {
    if (spinning || dissolving) return;
    var rect = container.getBoundingClientRect();
    var d2 = pointerDistSq(e.clientX, e.clientY, rect);
    var maxR = rect.width * 0.32;
    if (d2 > maxR * maxR) return;
    spin();
  });

  container.addEventListener('keydown', function (e) {
    if (spinning || dissolving) return;
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    spin();
  });

  function onViewportResize() {
    resizeThree();
  }
  window.addEventListener('resize', onViewportResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportResize);
  }
  resizeThree();
})();
  </script>
</body>
