<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 文档 URL 为 /tarot 时，相对路径脚本/样式须相对站点根解析，否则易全白 -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣域塔罗 · 完整六大牌阵 · 大师版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- 全局样式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 18px; /* 基础放大 */
        }
        body {
            background: #0b0510;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            color: #e5d5b3;
            padding: 1rem 0.75rem 2.5rem;
            position: relative;
            overflow-x: hidden;
            font-size: 1.1rem;
        }
        /* 宇宙背景（三层星云+星光） */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(96, 58, 128, 0.4) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(180, 130, 50, 0.3) 0%, transparent 45%);
            filter: blur(50px);
            animation: drift 60s infinite alternate ease-in-out;
        }
        .nebula-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(30, 20, 60, 0.5) 0%, transparent 50%),
                        radial-gradient(circle at 90% 20%, rgba(100, 50, 100, 0.3) 0%, transparent 40%);
            filter: blur(70px);
            animation: drift2 50s infinite alternate ease-in-out;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 5% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 15% 60%, #ffe5b0, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 25% 30%, #d4b8ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 35% 80%, #fff2c0, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 45% 20%, #ffd78a, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 55% 70%, #f0d0ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 65% 40%, #ffe4b5, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 75% 90%, #c2b0e6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 85% 50%, #ffeac2, rgba(0,0,0,0));
            background-repeat: repeat;
            opacity: 0.7;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes drift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-3%, -2%); }
        }
        @keyframes drift2 {
            0% { transform: scale(1.2) translate(-2%, 1%); }
            100% { transform: scale(1) translate(2%, -1%); }
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 主圣所：不再套金边外框，让 19 大类有完整宽度 */
        .sanctum {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: none;
            margin-left: auto;
            margin-right: auto;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            padding: 1.2rem clamp(1rem, 2vw, 2.5rem) 2.5rem;
            border: none;
            box-shadow: none;
            box-sizing: border-box;
        }

        /* 标题区 */
        .sanctum-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .sanctum-header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(3rem, 7vw, 5rem);
            letter-spacing: 10px;
            background: linear-gradient(180deg, #f9e2b0, #b38f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #ffb86b;
            margin-bottom: 0.5rem;
        }
        .sanctum-header .sub {
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: #b6974b;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            border-top: 1px solid rgba(212, 175, 55, 0.5);
            display: inline-block;
            padding: 0.5rem 2.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 40px;
        }

        /* 牌阵导航 */
        .spread-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .spread-tag {
            background: rgba(20,10,25,0.6);
            border: 1px solid #7a6a4b;
            border-radius: 40px;
            padding: 0.7rem 2.2rem;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: #d4b68a;
            cursor: pointer;
            transition: 0.2s;
        }
        .spread-tag:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #b6974b;
        }
        .spread-tag.active {
            background: #b69042;
            color: #0c0712;
            border-color: #ffdd99;
            box-shadow: 0 0 15px #fabc2f;
        }
        .spread-tag[hidden] {
            display: none !important;
        }
        .spread-synthesis {
            margin-top: 1.4rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(164, 142, 98, 0.35);
        }
        .west-article {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #d4d4d8;
            background: none;
            border: none;
            box-shadow: none;
        }
        .west-article h3.west-kicker {
            margin: 1.5rem 0 0.85rem;
            padding-top: 0;
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.45;
            letter-spacing: 0.06em;
            color: #FBBF24;
            background: none;
            border: none;
            box-shadow: none;
        }
        .west-article h3.west-kicker:first-child {
            margin-top: 0;
        }
        .west-flow {
            margin: 0 0 1.5rem;
            line-height: 1.8;
            color: #d4d4d8;
            background: none;
            border: none;
            box-shadow: none;
            padding: 0;
            overflow-wrap: break-word;
        }
        .west-name {
            display: inline;
            font-weight: 700;
            color: #fcd34d;
            background: rgba(120, 53, 15, 0.55);
            padding: 0.08rem 0.4rem;
            border-radius: 0.25rem;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            vertical-align: baseline;
        }
        .west-callout {
            margin-top: 1.5rem;
            padding: 1rem 1rem 0.25rem;
            border: none;
            border-left: 4px solid #f59e0b;
            background: rgba(69, 26, 3, 0.2);
            border-radius: 0 0.5rem 0.5rem 0;
            box-shadow: none;
        }
        .west-callout h3.west-kicker {
            margin-top: 0;
            padding-top: 0;
        }

        /* 问题库入口 */
        .question-sanctum {
            margin-bottom: 2.2rem;
            width: 100%;
            min-width: 0;
        }
        .category-selector {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: stretch;
            width: 100%;
            min-width: 0;
        }
        .category-tabs {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.7rem 0.85rem;
            width: 100%;
            min-width: 0;
            overflow: visible;
            padding: 0.15rem 0 0.35rem;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .category-tab {
            flex: 0 0 auto;
            white-space: nowrap;
            background: rgba(20, 10, 25, 0.6);
            border: 1px solid #7a6a4b;
            border-radius: 40px;
            padding: 0.55rem 1.15rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.02rem;
            color: #d4b68a;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .category-tab:hover {
            border-color: #b6974b;
            color: #f3e6d2;
            background: rgba(212, 175, 55, 0.12);
        }
        .category-tab.active {
            background: rgba(182, 144, 66, 0.35);
            border-color: #dbb45c;
            color: #ffefa8;
            box-shadow: 0 0 12px rgba(250, 188, 47, 0.2);
        }
        .category-tab:focus-visible {
            outline: 2px solid #deb887;
            outline-offset: 2px;
        }
        .ask-compose {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.65rem;
            width: 100%;
            min-width: 0;
        }
        .ask-compose input {
            flex: 1 1 16rem;
            min-width: 0;
            min-height: 3.25rem;
            box-sizing: border-box;
            border-radius: 999px;
            border: 1px solid #a9844a;
            background: rgba(10, 5, 18, 0.55);
            color: #f3e6d2;
            padding: 0.85rem 1.25rem;
            font-size: 1.05rem;
            line-height: 1.45;
        }
        .ask-compose input::placeholder {
            color: #8a7a60;
        }
        .ask-compose .ritual-btn {
            flex: 0 0 auto;
            margin: 0;
            font-size: 1.15rem;
            letter-spacing: 0.18em;
            padding: 0.75rem 1.8rem;
            box-shadow: 0 0 18px #9e7f45;
        }
        @media screen and (max-width: 640px) {
            .ask-compose .ritual-btn {
                width: 100%;
            }
        }
        /* 例子在提问栏下方，不插在输入和抽牌之间 */
        .category-questions-details {
            margin-top: 1rem;
            border: 1px solid rgba(122, 106, 75, 0.5);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }
        .category-questions-details > summary {
            list-style: none;
            cursor: pointer;
            padding: 0.75rem 1.1rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: #e7cf9c;
            user-select: none;
            transition: background 0.2s;
        }
        .category-questions-details > summary::-webkit-details-marker {
            display: none;
        }
        .category-questions-details > summary::before {
            content: '▸';
            display: inline-block;
            margin-right: 0.5rem;
            color: #b6974b;
            transition: transform 0.2s ease;
        }
        .category-questions-details[open] > summary::before {
            transform: rotate(90deg);
        }
        .category-questions-details > summary:hover {
            background: rgba(212, 175, 55, 0.08);
        }
        .category-questions-details > summary:focus-visible {
            outline: 2px solid #deb887;
            outline-offset: -2px;
        }
        .category-questions-body {
            padding: 0 1rem 1.1rem;
            border-top: 1px solid rgba(212, 175, 55, 0.12);
        }
        .question-filter-tabs {
            display: none;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.7rem;
            width: 100%;
            min-width: 0;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            padding: 0.85rem 0 1rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .question-filter-tabs.is-on {
            display: flex;
        }
        .question-filter-tab {
            flex: 0 0 auto;
            white-space: nowrap;
            background: rgba(20, 10, 25, 0.45);
            border: 1px solid rgba(169, 132, 74, 0.75);
            border-radius: 999px;
            padding: 0.62rem 1.3rem;
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 1.28rem;
            font-weight: 600;
            line-height: 1.3;
            color: #f3e6d2;
            cursor: pointer;
            outline: none;
            min-width: 5.5rem;
        }
        .question-filter-tab:hover {
            border-color: #b6974b;
            color: #f3e6d2;
        }
        .question-filter-tab.active {
            background: rgba(182, 144, 66, 0.32);
            border-color: #dbb45c;
            color: #ffefa8;
        }
        .question-filter-tab:focus-visible {
            outline: 2px solid #deb887;
            outline-offset: 2px;
        }
        .question-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            width: 100%;
            min-width: 0;
        }
        .question-option {
            flex: 0 1 auto;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.02);
            border: 1px solid #5d4d31;
            border-radius: 1rem;
            padding: 0.6rem 1.1rem;
            font-size: 1.1rem;
            line-height: 1.55;
            color: #d3c7b0;
            cursor: pointer;
            transition: 0.2s;
            white-space: normal;
            overflow-wrap: break-word;
        }
        .question-option:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #b6974b;
            color: #ffdfa7;
        }
        .question-option.selected {
            background: #b69042;
            color: #0c0712;
            border-color: #ffdd99;
        }
        .question-more {
            font-size: 1rem;
            color: #a48e62;
            font-style: italic;
            padding: 0.5rem 1.2rem;
            cursor: default;
        }

        /* 牌阵容器 */
        .spread-container {
            display: none;
            margin: 2.5rem 0 3rem;
        }
        .spread-container.active {
            display: block;
        }

        /* 牌阵与解读都吃满全局容器，左右与输入框对齐 */
        .spread-layout {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            width: 100%;
            max-width: none;
            min-width: 0;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: none;
            border-radius: 0;
        }
        .position-panel {
            width: 100%;
            min-width: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
        }
        .position-panel h3 {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            color: #e7cf9c;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            border: none;
            padding: 0;
            margin: 0 0 0.85rem;
        }
        .position-list {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0.5rem;
            width: 100%;
            min-width: 0;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            padding: 0.1rem 0 0.2rem;
        }
        .position-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            flex: 0 0 auto;
            min-width: 6.4rem;
            min-height: 0;
            padding: 0.5rem 0.7rem;
            border-radius: 999px;
            background: rgba(243, 224, 176, 0.08);
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-20px);
            text-align: center;
        }
        .position-item:hover,
        .position-item.active {
            background: rgba(243, 224, 176, 0.08);
            border: none;
            box-shadow: none;
        }
        .pos-name {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 0.95rem;
            line-height: 1.3;
            color: #ffdfa7;
            white-space: nowrap;
        }
        .pos-card {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #cbbfa8;
            font-style: normal;
            white-space: nowrap;
            background: none;
            padding: 0;
            border: none;
            border-radius: 0;
        }

        /* 右侧解读区 */
        .reading-panel {
            width: 100%;
            max-width: none;
            min-width: 0;
            margin: 0;
            box-sizing: border-box;
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: none;
        }
        @media screen and (min-width: 768px) {
            .position-list {
                display: grid;
                overflow: visible;
                gap: 0.75rem;
                grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            }
            .spread-layout[data-spread="venus"] .position-list {
                grid-template-columns: repeat(7, minmax(0, 1fr));
            }
            .spread-layout[data-spread="triangle"] .position-list,
            .spread-layout[data-spread="trinity"] .position-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .spread-layout[data-spread="choice"] .position-list,
            .spread-layout[data-spread="hexagram"] .position-list {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
            .spread-layout[data-spread="celtic"] .position-list {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
            .spread-layout[data-spread="single"] .position-list {
                grid-template-columns: minmax(0, 14rem);
                justify-content: start;
            }
            .position-item {
                width: 100%;
                min-width: 0;
                flex: none;
                overflow: visible;
                border-radius: 1rem;
                padding: 0.65rem 0.3rem;
            }
            .pos-name,
            .pos-card {
                white-space: normal;
                overflow-wrap: anywhere;
                max-width: 100%;
            }
            .reading-panel {
                padding: 2rem;
            }
        }
        .reading-header {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
            min-width: 0;
        }
        .reading-heading {
            min-width: 0;
            flex: 1 1 auto;
        }
        .reading-header i {
            font-size: 1.25rem;
            color: #e2c27a;
            margin-top: 0.35rem;
        }
        .reading-header h2 {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 1.55rem;
            font-weight: 600;
            color: #f3e0b0;
            letter-spacing: 0.16em;
        }
        .reading-question {
            margin: 0.45rem 0 1rem;
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            font-size: 1.08rem;
            font-weight: 600;
            line-height: 1.65;
            color: #FBBF24;
            overflow-wrap: break-word;
        }
        .reading-question:empty {
            display: none;
        }
        .card-detail {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .detail-cardname {
            font-size: 2.5rem;
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #fff1d0, #cbae7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
            margin-bottom: 0.7rem;
        }
        .detail-sub {
            color: #f5c84e;
            font-size: 1.4rem;
            font-style: italic;
            border-left: 4px solid #f5c84e;
            padding-left: 1.2rem;
            margin: 1.2rem 0 1.8rem;
        }
        .detail-desc {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #d3c7b0;
            margin-bottom: 1.8rem;
        }
        .core-lesson {
            background: rgba(26, 17, 33, 0.8);
            border-left: 5px solid #dbb45c;
            padding: 1.3rem 1.8rem;
            border-radius: 30px;
            margin: 1.8rem 0;
        }
        .core-lesson p {
            font-size: 1.25rem;
            color: #ffdfa7;
        }
        .action-today {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 1.2rem 1.8rem;
            border: 1px dashed #ad8f51;
        }
        .action-today i {
            font-size: 2.1rem;
            color: #f5c84e;
        }
        .action-today span {
            font-size: 1.25rem;
            color: #f2e1ba;
        }

        /* 抽牌按钮（与输入框并排时由 .ask-compose 收口） */
        .draw-zone {
            text-align: center;
            margin: 0;
        }
        .ritual-btn {
            background: linear-gradient(145deg, #4a3a22, #2a1e12);
            border: 2px solid #dbb45c;
            color: #ffdfa7;
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            padding: 1.3rem 5rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 30px #9e7f45;
            transition: 0.3s;
            letter-spacing: 4px;
            outline: none;
        }
        .ritual-btn:hover {
            background: #5e4b2e;
            box-shadow: 0 0 50px #dbb45c;
            transform: scale(1.03);
        }
        .followup-zone {
            width: 100%;
            min-width: 0;
            margin: 0 0 1.35rem;
            padding: 0;
            text-align: center;

    <script>
        (function() {
            // ---------- 牌ID映射：tarotData → tarotMasterReadings ----------
            const cardKeyMap = {
                // 大牌映射
                'fool': 'fool', 'magician': 'magician', 'priestess': 'highPriestess',
                'empress': 'empress', 'emperor': 'emperor', 'hierophant': 'hierophant',
                'lovers': 'lovers', 'chariot': 'chariot', 'strength': 'strength',
                'hermit': 'hermit', 'wheel': 'wheelOfFortune', 'justice': 'justice',
                'hanged': 'hangedMan', 'death': 'death', 'temperance': 'temperance',
                'devil': 'devil', 'tower': 'tower', 'star': 'star',
                'moon': 'moon', 'sun': 'sun', 'judgement': 'judgement', 'world': 'world',
                // 权杖
                'wands1': 'aceOfWands', 'wands2': 'twoOfWands', 'wands3': 'threeOfWands',
                'wands4': 'fourOfWands', 'wands5': 'fiveOfWands', 'wands6': 'sixOfWands',
                'wands7': 'sevenOfWands', 'wands8': 'eightOfWands', 'wands9': 'nineOfWands', 'wands10': 'tenOfWands',
                'wands_page': 'pageOfWands', 'wands_knight': 'knightOfWands',
                'wands_queen': 'queenOfWands', 'wands_king': 'kingOfWands',
                // 圣杯
                'cups1': 'aceOfCups', 'cups2': 'twoOfCups', 'cups3': 'threeOfCups',
                'cups4': 'fourOfCups', 'cups5': 'fiveOfCups', 'cups6': 'sixOfCups',
                'cups7': 'sevenOfCups', 'cups8': 'eightOfCups', 'cups9': 'nineOfCups', 'cups10': 'tenOfCups',
                'cups_page': 'pageOfCups', 'cups_knight': 'knightOfCups',
                'cups_queen': 'queenOfCups', 'cups_king': 'kingOfCups',
                // 宝剑
                'swords1': 'aceOfSwords', 'swords2': 'twoOfSwords', 'swords3': 'threeOfSwords',
                'swords4': 'fourOfSwords', 'swords5': 'fiveOfSwords', 'swords6': 'sixOfSwords',
                'swords7': 'sevenOfSwords', 'swords8': 'eightOfSwords', 'swords9': 'nineOfSwords', 'swords10': 'tenOfSwords',
                'swords_page': 'pageOfSwords', 'swords_knight': 'knightOfSwords',
                'swords_queen': 'queenOfSwords', 'swords_king': 'kingOfSwords',
                // 星币
                'pentacles1': 'aceOfPentacles', 'pentacles2': 'twoOfPentacles', 'pentacles3': 'threeOfPentacles',
                'pentacles4': 'fourOfPentacles', 'pentacles5': 'fiveOfPentacles', 'pentacles6': 'sixOfPentacles',
                'pentacles7': 'sevenOfPentacles', 'pentacles8': 'eightOfPentacles', 'pentacles9': 'nineOfPentacles', 'pentacles10': 'tenOfPentacles',
                'pentacles_page': 'pageOfPentacles', 'pentacles_knight': 'knightOfPentacles',
                'pentacles_queen': 'queenOfPentacles', 'pentacles_king': 'kingOfPentacles'
            };

            // 获取大师解读的函数
            /** tarot-master 牌 baseId → Dmy 牌 id（与 tarotMasterQuestionContent 入库一致） */
            function baseIdToDmyTarotId(baseId) {
                const majors = {
                    fool: 'major_0', magician: 'major_1', priestess: 'major_2', empress: 'major_3',
                    emperor: 'major_4', hierophant: 'major_5', lovers: 'major_6', chariot: 'major_7',
                    strength: 'major_8', hermit: 'major_9', wheel: 'major_10', justice: 'major_11',
                    hanged: 'major_12', death: 'major_13', temperance: 'major_14', devil: 'major_15',
                    tower: 'major_16', star: 'major_17', moon: 'major_18', sun: 'major_19',
                    judgement: 'major_20', world: 'major_21',
                };
                if (majors[baseId]) return majors[baseId];
                const suits = ['wands', 'cups', 'swords', 'pentacles'];
                for (let i = 0; i < suits.length; i++) {
                    const suit = suits[i];
                    if (baseId.startsWith(suit)) {
                        const tail = baseId.slice(suit.length);
                        if (/^\d+$/.test(tail)) return suit + '_' + tail;
                        if (tail === '_page') return suit + '_11';
                        if (tail === '_knight') return suit + '_12';
                        if (tail === '_queen') return suit + '_13';
                        if (tail === '_king') return suit + '_14';
                    }
                }
                return null;
            }

            function escapeHtmlReading(s) {
                if (s == null || s === '') return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function nlToBrEscaped(s) {
                return escapeHtmlReading(s).replace(/\r\n/g, '\n').replace(/\n/g, '<br>');
            }

            /** 各大类【你正在问】下：优雅说明「只解牌、不代你决策」的边界（学业可带题库分带名 studyBand） */
            function readingScopeDisclaimerHtml(categoryKey, studyBand) {
                const wrap = (inner) =>
                    `<div class="section-content" style="margin-top:0.55rem;color:#c9b896;font-size:0.94em;line-height:1.55;">${inner}</div>`;
                if (categoryKey === 'study') {
                    const t = studyBand != null && String(studyBand).trim() ? escapeHtmlReading(String(studyBand).trim()) : '';
                    const lead = t ? `本题落在「${t}」这一条目下——` : '本题落在学业与应试的语境里——';
                    return wrap(
                        lead +
                            '我不替你选课或押分，只据这张牌把当下该守住的专注与卡点说清楚；复习、上场与后果，仍由你自担。'
                    );
                }
                const ZH = {
                    love: '本题落在亲密与边界的语境里——我不替你做「在一起或分开」的判决，只据这张牌把此刻的心意与拉扯说清楚；路怎么走，仍请你对自己诚实、负责。',
                    career: '本题落在职场与去向的语境里——我不替你去留或谈判代笔，只据这张牌把眼前的压力与可走的一步说清楚；最终怎么选，仍在你手上。',
                    money: '本题落在收支与风险的语境里——我不替你裁定买借投退，只据这张牌把节奏与底线提醒说清楚；数字与契约，请你亲自核对。',

                const line = ZH[categoryKey];

            }

            function resolveQuestionKey(questionText, categoryTab) {
                const R = window.TarotQuestionResolve;
                if (!R || !questionText) return questionText;
                const catId = typeof R.tabToCategory === 'function' ? R.tabToCategory(categoryTab) : '';
                if (typeof R.canonicalForReading === 'function') return R.canonicalForReading(questionText, catId);
                return questionText;
            }

            /** 多牌阵合读取位：罪名／判决／执行（索引相对当前抽牌） */
            const spreadSynthesisSlots = {
                triangle: { charge: 1, verdict: 2, exec: 2 },
                hexagram: { charge: 1, verdict: 2, exec: 3 },
                trinity: { charge: 1, verdict: 2, exec: 2 },
                venus: { charge: 2, verdict: 5, exec: 4 },
                celtic: { charge: 0, verdict: 9, exec: 4 },
                choice: { charge: 0, verdict: 2, exec: 5 },
            };

            function stripReadingTagLine(text) {
                return String(text || '')
                    .replace(/牌面看[^。\n]*。?/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function getWesternRowForCard(cardId, questionText) {
                const W = window.TarotWesternReading;
                if (!questionText || !W || typeof W.get !== 'function' || !cardId) return null;
                const baseId = String(cardId).replace('_rev', '');
                const dmyId = baseIdToDmyTarotId(baseId);
                if (!dmyId) return null;
                const upright = !String(cardId).endsWith('_rev');
                const R = window.TarotQuestionResolve;
                const catId = (R && typeof R.tabToCategory === 'function')
                    ? R.tabToCategory(getCategoryValue())
                    : '感情婚姻';
                return W.get(catId || '感情婚姻', questionText, dmyId, upright) || null;
            }

            function isHowTheySeeQuestion(questionText) {
                const q = String(questionText || "");
                if (q.indexOf("怎么看我") !== -1) return true;
                if (q.indexOf("信哪头") !== -1) return true;
                return false;
            }

            function lockedBookFor(questionText) {
                const q = String(questionText || "");
                if (q.indexOf("信哪头") !== -1) return window.Q02Locked || null;
                return null;
            }

            function q02LockedFor(cardId, questionText) {
                const book = lockedBookFor(questionText);
                if (!book || !cardId) return null;
                const baseId = String(cardId).replace("_rev", "");
                const dmyId = baseIdToDmyTarotId(baseId);
                if (!dmyId) return null;
                const upright = !String(cardId).endsWith("_rev");
                return book[dmyId + "|" + (upright ? "u" : "r")] || null;
            }

            function q02SingleFor(cardId, questionText) {
                if (String(questionText || "").indexOf("信哪头") === -1) return null;
                const book = window.Q02Single;
                if (!book || !cardId) return null;
                const baseId = String(cardId).replace("_rev", "");
                const dmyId = baseIdToDmyTarotId(baseId);
                if (!dmyId) return null;
                const upright = !String(cardId).endsWith("_rev");
                return book[dmyId + "|" + (upright ? "u" : "r")] || null;
            }

            function q01SingleFor(cardId, questionText) {
                if (String(questionText || "").indexOf("怎么看我") === -1) return null;
                const book = window.Q01Single;
                if (!book || !cardId) return null;
                const baseId = String(cardId).replace("_rev", "");
                const dmyId = baseIdToDmyTarotId(baseId);
                if (!dmyId) return null;
                const upright = !String(cardId).endsWith("_rev");
                return book[dmyId + "|" + (upright ? "u" : "r")] || null;
            }

            function articleFaces(questionText) {
                const positions = positionsForSpread(activeSpread);
                const cards = currentDraws[activeSpread];
                if (!positions || !positions.length || !Array.isArray(cards) || cards.length < positions.length) return null;
                const faces = [];
                for (let i = 0; i < positions.length; i++) {
                    const row = getWesternRowForCard(cards[i], questionText);
                    const lean = row && String(row.lean || "").replace(/。$/, "").trim();
                    const verdict = row && String(row.verdict || "").trim();
                    const upright = !String(cards[i]).endsWith("_rev");
                    const dmyId = baseIdToDmyTarotId(String(cards[i]).replace("_rev", ""));
                    const item = document.querySelectorAll("#" + activeSpread + "List .position-item")[i];
                    const shown = item && item.querySelector(".pos-card")
                        ? String(item.querySelector(".pos-card").textContent || "").trim()
                        : "";
                    const locked = q02LockedFor(cards[i], questionText);
                    const singleEssay = q02SingleFor(cards[i], questionText) || q01SingleFor(cards[i], questionText);
                    const howThey = String(questionText || "").indexOf("怎么看我") !== -1;
                    if ((!row || !lean || !verdict || !row.nameZh) && howThey && singleEssay && singleEssay.open && singleEssay.action) {
                        faces.push({
                            pos: positions[i],
                            name: shown || "这一张",
                            ori: upright ? "正着" : "逆着",
                            shown: shown,
                            lean: "有",
                            see: "",
                            verdict: "有",
                            speak: singleEssay.open,
                            doToday: singleEssay.action,
                            picture: locked ? locked.picture : "",
                            trust: locked ? locked.trust : "",
                            watch: locked ? locked.watch : "",
                            singleOpen: singleEssay.open,
                            singleAction: singleEssay.action,
                            key: dmyId ? dmyId + "|" + (upright ? "u" : "r") : "",
                            label: positions[i] + " · " + (shown || "这一张")
                        });
                        continue;
                    }
                    if (!row || !lean || !verdict || !row.nameZh) return null;
                    faces.push({
                        pos: positions[i],
                        name: row.nameZh,
                        ori: upright ? "正着" : "逆着",
                        shown: shown,
                        lean: lean,
                        see: "对方" + lean,
                        verdict: verdict,
                        speak: String(row.speak || "").replace(/骨子里/g, "底下").trim(),
                        doToday: String(row.doToday || "").trim(),
                        picture: locked ? locked.picture : "",
                        trust: locked ? locked.trust : "",
                        watch: locked ? locked.watch : "",
                        singleOpen: singleEssay ? singleEssay.open : "",
                        singleAction: singleEssay ? singleEssay.action : "",
                        key: dmyId ? dmyId + "|" + (upright ? "u" : "r") : "",
                        label: positions[i] + " · " + (shown || row.nameZh)
                    });
                }
                return faces;
            }

            function splitSentences(text) {
                return String(text || "").split("。").map(function (s) { return s.trim(); }).filter(Boolean);
            }

            function joinSen(list) {
                return list.filter(Boolean).map(function (s) {
                    s = String(s).trim();
                    if (!s) return "";
                    return /。$/.test(s) ? s : s + "。";
                }).filter(Boolean).join("");
            }

            function cardPicture(speak, name) {
                const parts = splitSentences(speak);
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].indexOf(name) !== -1 && (parts[i].indexOf("正着") !== -1 || parts[i].indexOf("逆着") !== -1)) {
                        return parts[i].replace(/^.*?[正逆]着[，,]/, "").trim();
                    }
                }
                return "";
            }

            function speakRest(speak, name) {
                const parts = splitSentences(speak);
                const out = [];
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    if (p.indexOf("今天") !== -1) continue;
                    if (p.indexOf(name) !== -1 && (p.indexOf("正着") !== -1 || p.indexOf("逆着") !== -1)) continue;
                    if (p.indexOf("对方现在") === 0) continue;
                    out.push(p);
                }
                return out;
            }

            function todaySentence(speak) {
                const parts = splitSentences(speak);
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].indexOf("今天") !== -1) return parts[i] + "。";
                }
                return "";
            }

            function afterToday(speak) {
                const parts = splitSentences(speak);
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].indexOf("今天") !== -1 && parts[i + 1]) return parts[i + 1];
                }
                return "";
            }

            function fromToday(speak) {
                const parts = splitSentences(speak);
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].indexOf("今天") !== -1) return parts.slice(i).join("。");
                }
                return "";
            }

            function seatRole(spread, index) {
                const book = {
                    venus: ["self", "other", "bond", "stuck", "advice", "result", "hidden"],
                    triangle: ["past", "other", "result"],
                    hexagram: ["past", "other", "result", "advice", "scene", "fear"],
                    trinity: ["scene", "other", "hidden"],
                    celtic: ["other", "stuck", "hidden", "past", "result", "self", "scene", "fear", "scene", "result"],
                    choice: ["scene", "stuck", "result", "scene", "stuck", "result"]
                };
                const list = book[spread] || [];
                return list[index] || "other";
            }

            function shiftFirst(sentence, role) {
                let s = String(sentence || "").replace(/骨子里/g, "底下").replace(/。$/, "").trim();
                if (!s) return "";
                if (role === "advice") return "";
                if (role === "self") {
                    s = s.replace(/^对方现在觉得/, "")
                        .replace(/^对方现在把你看成/, "你像")
                        .replace(/^对方现在把你放在/, "你站在")
                        .replace(/^对方现在把你算进/, "你把自己算进")
                        .replace(/^对方现在把你/, "")
                        .replace(/^对方现在用/, "你让人用")
                        .replace(/^对方现在看你是/, "你是")
                        .replace(/^对方现在对你的看法是/, "你给人的看法是")
                        .replace(/^对方现在/, "");
                    s = s.replace(/你在对方眼里是/g, "你是").replace(/^觉得/, "");
                    return s;
                }
                if (role === "bond") {
                    return s.replace(/^对方现在觉得/, "这段里，")
                        .replace(/^对方现在把你/, "这段把你")
                        .replace(/^对方现在用/, "这段用")
                        .replace(/^对方现在/, "这段里，");
                }
                if (role === "stuck") {
                    return s.replace(/^对方现在觉得/, "")
                        .replace(/^对方现在把你看成/, "过不去，对方把你看成")
                        .replace(/^对方现在把你/, "过不去，对方把你")
                        .replace(/^对方现在用/, "过不去，对方用")
                        .replace(/^对方现在/, "");
                }
                if (role === "result") return s.replace(/^对方现在/, "再这样下去，对方");
                if (role === "hidden") return s.replace(/^对方现在/, "还没说出口的是，对方");
                if (role === "past") return s.replace(/^对方现在/, "从前对方");
                if (role === "fear") return s.replace(/^对方现在/, "你把盼和怕读成了：对方");
                if (role === "scene") {
                    return s.replace(/^对方现在觉得/, "")
                        .replace(/^对方现在把你/, "人被")
                        .replace(/^对方现在用/, "看上去在用")
                        .replace(/^对方现在/, "");
                }
                return s.replace(/^对方现在/, "对方");
            }

            function shiftVerdict(verdict, role) {
                const parts = splitSentences(String(verdict || "").replace(/骨子里/g, "底下"));
                if (!parts.length) return "";
                parts[0] = shiftFirst(parts[0], role);
                if (role === "self") {
                    for (let i = 1; i < parts.length; i++) {
                        parts[i] = parts[i].replace(/你在对方眼里是/g, "你是");
                    }
                }
                return parts.filter(Boolean).join("。");
            }

            function seatParagraph(role, face) {
                const pic = cardPicture(face.speak, face.name);
                if (role === "advice") return joinSen([pic, fromToday(face.speak)]);
                const shifted = shiftVerdict(face.verdict, role);
                const parts = splitSentences(shifted);
                if (parts.length >= 2) return joinSen([pic].concat(parts));
                return joinSen([pic, shifted, (speakRest(face.speak, face.name)[0] || "")]);
            }

            function articleOpen(spread, faces) {
                if (spread === "single") return String(faces[0].verdict || "").replace(/骨子里/g, "底下");
                if (spread === "venus") {
                    return joinSen([
                        shiftFirst(splitSentences(faces[0].verdict)[0], "self"),
                        shiftVerdict(faces[1].verdict, "other")
                    ]);
                }
                if (spread === "choice" && faces.length >= 6) {
                    return joinSen([
                        "A走到头，" + shiftFirst(splitSentences(faces[2].verdict)[0], "other"),
                        "B走到头，" + shiftFirst(splitSentences(faces[5].verdict)[0], "other"),
                        "你问的是现在。你人站在哪一条，就只认那一条"
                    ]);
                }
                const nowAt = { triangle: 1, hexagram: 1, trinity: 1, celtic: 0 }[spread];
                const i = nowAt === undefined ? 0 : nowAt;
                const face = faces[i] || faces[0];
                return shiftVerdict(face.verdict, "other");
            }

            function articleAction(spread, faces) {
                if (spread === "choice" && faces[1] && faces[4]) {
                    return joinSen([
                        "人在A。" + fromToday(faces[1].speak),
                        "人在B。" + fromToday(faces[4].speak)
                    ]);
                }
                const at = { venus: 4, triangle: 1, hexagram: 3, trinity: 1, celtic: 0, single: 0 }[spread];
                const face = faces[at == null ? 0 : at] || faces[0];
                if (!face) return "";
                const move = fromToday(face.speak);
                if (move) return joinSen([move]);
                return shiftFirst(splitSentences(face.verdict)[0], "other");
            }

            function articleChain(spread, faces) {
                if (!faces || faces.length < 2) return "";
                const head = {
                    triangle: "这三张是一条线。",
                    choice: "这六张是一条线。",
                    hexagram: "这六张是一条线。",
                    trinity: "这三张是一条线。",
                    celtic: "这十张是一条线。",
                    venus: "这七张是一条线。"
                }[spread] || "这一阵是一条线。";
                const bits = faces.map(function (f, i) {
                    const role = seatRole(spread, i);
                    if (role === "advice") {
                        const move = todaySentence(f.speak).replace(/。$/, "");
                        return move || shiftFirst(splitSentences(f.verdict)[0], "other");
                    }
                    return shiftFirst(splitSentences(f.verdict)[0], role);
                });
                return head + joinSen(bits);
            }

            function singlePaidText(face) {
                const pic = cardPicture(face.speak, face.name);
                const rest = speakRest(face.speak, face.name);
                return joinSen([pic].concat(rest));
            }

            function isSignalQuestion(questionText) {
                return String(questionText || "").indexOf("信哪头") !== -1;
            }

            function isStencilSentence(s) {
                const t = String(s || "");
                if (t.indexOf("热的那头") !== -1 || t.indexOf("冷的那头") !== -1) return true;
                if (/^热是/.test(t) || /^冷是/.test(t)) return true;
                if (/^信冷的/.test(t) || /^信热的/.test(t)) return true;
                if (t.indexOf("慢慢转好") !== -1 || t.indexOf("先热一阵") !== -1) return true;
                if (t.indexOf("热的就") !== -1 || t.indexOf("冷的就") !== -1) return true;
                if (t.indexOf("单方面的结果") !== -1) return true;
                return false;
            }

            function isVerdictTail(s) {
                const t = String(s || "");
                if (isStencilSentence(t)) return true;
                if (/^没有/.test(t)) return true;
                if (/^不找|^再空|^再射|^出现不了|^做不到|^裂开是已经|^已经发生|^你继续/.test(t)) return true;
                if (t.indexOf("对方就继续") !== -1) return true;
                if (t.indexOf("已经信的") !== -1) return true;
                return false;
            }

            function looksLikeMove(s) {
                return /今天|看|不要|别逼|把|停|说|留|做|问|放慢|撤|少做|先/.test(String(s || ""));
            }

            function testMove(speak) {
                const parts = splitSentences(speak);
                const out = [];
                let started = false;
                for (let i = 0; i < parts.length; i++) {
                    let p = parts[i];
                    if (p.indexOf("今天") !== -1 && p.indexOf("不是今天") === -1) started = true;
                    if (!started) continue;
                    if (p.indexOf("反过来顾") !== -1) {
                        p = "今天留一件你平时会替对方做的照顾，这次不做，看对方接不接";
                    }
                    p = p.replace(/[，,]没有[，,].*$/, "").replace(/[，,]热的就.*$/, "").replace(/[，,]冷的就.*$/, "").trim();
                    if (!p || isVerdictTail(p) || !looksLikeMove(p)) continue;
                    out.push(p);
                    if (out.length >= 2) break;
                }
                return out.join("。");
            }

            function polishBit(text) {
                let s = String(text || "").trim();
                s = s.replace(/海还在，船期乱了/g, "海还在，船期是乱的");
                s = s.replace(/对方下一段时间消失/g, "对方下一段时间会消失");
                s = s.replace(/冷一点的慢才是对方给的/g, "这一点慢是对方给的");
                s = s.replace(/改期和「快了」，可是对方开始用不会到看你/g, "改期和「快了」还在嘴上，对方已经用「不会到」在看你");
                return s;
            }

            function facePic(face) {
                return polishBit(face ? cardPicture(face.speak, face.name) : "");
            }

            function isWarmFace(face) {
                if (!face || face.ori !== "正着") return false;
                return {
                    "权杖四": 1,
                    "太阳": 1,
                    "世界": 1,
                    "星星": 1,
                    "星币十": 1,
                    "圣杯十": 1
                }[face.name] === 1;
            }

            function isDoorFace(face) {
                return !!(face && face.name === "权杖四" && face.ori === "正着");
            }

            function isHouseFace(face) {
                return !!(face && face.name === "星币十" && face.ori === "正着");
            }

            function warmGloss(face) {
                if (isDoorFace(face)) return "这扇门是开的，是给人走进去高兴的。它还不是今天已经握在手里的事";
                if (isHouseFace(face)) return "这套日子是真的，能把人留下来。它不是一句情绪上的补丁";
                return "";
            }

function sideOk(text) {
                const s = String(text || "").trim();
                return s.length >= 4;
            }

            function bitOk(text) {
                const s = String(text || "").trim();
                if (s.length < 6) return false;
                if (/热的那头|冷的那头|这一头|这张牌|先做能被看见|像不像这一幕/.test(s)) return false;
                return true;
            }

            function pairLine(face) {
                if (!face) return "";
                const blob = String(face.verdict || "") + "。" + String(face.speak || "");
                const parts = splitSentences(blob);
                for (let i = 0; i < parts.length; i++) {
                    const m = parts[i].match(/热的那头(?:是)?([^，,]+)[，,]冷的那头(?:是)?(.+)/);
                    if (!m) continue;
                    let left = m[1].trim();
                    let right = m[2].trim();
                    if (/门关/.test(right) && isDoorFace(face)) right = "";
                    if (/^若|^不是/.test(left) || /^若|^不是/.test(right)) {
                        const keep = [right, left].filter(function (s) { return s.length >= 6 && !/^若|^不是/.test(s); })[0];
                        if (keep) return polishBit(keep);
                        continue;
                    }
                    if (sideOk(left) && sideOk(right) && (left.length >= 6 || right.length >= 6)) return polishBit(left + "，可是" + right);
                }
                return "";
            }

            function proseBits(face) {
                if (!face) return [];
                if (/先别信|两头都先|两头先|还不能信/.test(face.lean || "")) return ["两头先别认死，先认已经摆在眼前的事"];
                const scored = [];
                function add(text, score) {
                    text = polishBit(String(text || "").replace(/。$/, "").trim());
                    if (!bitOk(text)) return;
                    for (let i = 0; i < scored.length; i++) if (scored[i].text === text) return;
                    scored.push({ text: text, score: score });
                }
                const pair = pairLine(face);
                if (pair) add(pair, 6);
                const parts = splitSentences(String(face.verdict || "") + "。" + String(face.speak || ""));
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    if (/^冷是/.test(p)) {
                        if (pair) continue;
                        const cold = p.replace(/^冷是/, "").trim();
                        if (cold.length >= 6) add(cold.indexOf("对方") === 0 ? cold : "对方" + cold, 4);
                        continue;
                    }
                    if (p.indexOf("今天") !== -1) continue;
                    if (p.indexOf(face.name) !== -1 && /[正逆]着/.test(p)) continue;
                    if (isStencilSentence(p) || isVerdictTail(p)) continue;
                    if (/^信/.test(p) || /^对方现在/.test(p) || /^你要/.test(p)) continue;
                    if (/两头都信|不极端|不逼宫|哪一头/.test(p)) continue;
                    let score = 1;

                const hand = dreamHandOf(primary) || dreamHandOf(other) || "今天只放下已经说清的那一小截";
                let extra = "";
                const s = String(q || "");
                if (s.includes("同一点醒来")) {
                    return "醒来留两行。第一行只写醒来时身体最沉的那一下，一句。第二行写最近哪件事，是同一种守着、写大、不松手。今晚只做一件具体的：把故事停掉，吃一点，或把守夜降一档，然后躺下。画面你还没说。你说了，才能分清哪一句是身体，哪一句是心事。";
                }
                if (s.includes("助眠")) extra = "药先不动。若要跟医生提，就带这两行原话，不带你自己的诊断。";
                else if (s.includes("发烧")) extra = "人还不舒服的时候，先当身体。缓过来这一下还在，再当心事。";
                else if (s.includes("孩子")) extra = "先陪着孩子，话少一点。这一幕不要讲给孩子听。牌不替孩子下诊断。若夜惊反复，再问儿科或睡眠的人。";
                else if (s.includes("出轨")) extra = "梦不是证据，不要拿它去问罪。说之前先分清：这是怕，还是白天有一句你没问过的事实。";
                else if (s.includes("辞职")) extra = "这不等于明天就交辞职信。先别递辞呈。";
                else if (s.includes("预兆")) extra = "家人的怕归他们。你不用按他们说的预兆改计划。";
                else if (s.includes("夜里喊")) extra = "若喊得很频，跟医生提一句，不自己下结论。";
                else if (s.includes("噩梦要不要当真")) extra = "醒来先把脚放回地上。当真的是那种感觉，不是即将发生的情节。";
                const frame = dreamFrame(q);
                return "醒来留两行。第一行只写梦里最沉的那种感觉，一句。第二行写最近哪件事，给你的就是这种感觉。对上的那件，" + hand + "。做的时候摊开，不绕开。梦里的画面你还没说。你说了，这一截才能对上那一件。" + extra;
            }

            function dreamSpreadPlan(spread, n) {
                if (spread === "choice" && n >= 6) {
                    return {
                        open: "你先别急着给这个梦下判词。我按你抽出的两边说，你听里面那一下就行。",
                        wakeAt: 2,
                        groups: [
                            { title: "A 这一边", lines: [
                                [0, "{sit}，这一边还抓得住的，不是你更会逃。", false],
                                [1, "没过去，是因为紧接着这一下。", false],
                                [2, "这一边走完，不是逃脱。", true]
                            ]},
                            { title: "B 这一边", lines: [
                                [3, "另一边，{sit}，你想换成的是这一下。", false],
                                [4, "可换过去并不轻。", false],
                                [5, "那一边走完，人还在原地，是因为这一下。", true]
                            ]}
                        ],
                        scene: function (sit, close, rows) {
                            var L = rows.map(dreamLean);
                            return "一边，" + L[0] + L[1] + "走到这一边的头上，" + L[2] + "另一边，" + L[3] + L[4] + "走到那一边的头上，" + L[5] + close;
                        }
                    };
                }
                if (spread === "triangle" && n >= 3) {
                    return {
                        open: "你先别急着给这个梦下判词。我按过去、现在、未来说，你听里面那一件就行。",
                        wakeAt: 2,
                        groups: [
                            { title: "过去", lines: [[0, "{sit}，先发生的是这一截。", true]] },
                            { title: "现在", lines: [[1, "它现在还停在这一下，不是已经过去了。", true]] },
                            { title: "未来", lines: [[2, "再往前不是一张日程。{sit}，它会走到这一下。", true]] }
                        ],
                        scene: function (sit, close, rows) {
                            var L = rows.map(dreamLean);
                            return L[0] + "到了现在，" + L[1] + "再往前，" + L[2] + close;
                        }
                    };
                }
                if (spread === "trinity" && n >= 3) {
                    return {
                        open: "你先别急着给这个梦下判词。我按信号、白天、消化说，你听里面那一件就行。",
                        wakeAt: 1,
                        groups: [
                            { title: "信号", lines: [[0, "{sit}，信号先落在这一下。", true]] },
                            { title: "白天", lines: [[1, "它接到白天的，是这一下，不对情节。", true]] },
                            { title: "消化", lines: [[2, "你夜里真正在消化的，是这一下。", true]] }
                        ],
                        scene: function (sit, close, rows) {
                            var L = rows.map(dreamLean);
                            return "信号先是，" + L[0] + "白天对上的是，" + L[1] + "夜里在消化的是，" + L[2] + close;
                        }
                    };
                }
                if (spread === "hexagram" && n >= 6) {
                    return {
                        open: "你先别急着给这个梦下判词。我按这六张的位置说，你听里面那一下就行。",
                        wakeAt: 3,
                        groups: [
                            { title: "过去", lines: [[0, "{sit}，它从这一截来。", true]] },
                            { title: "现在", lines: [[1, "此刻还站在这一下。", true]] },
                            { title: "未来", lines: [[2, "再往前不是日期，是这一下。", true]] },
                            { title: "行动", lines: [[3, "今天真要动的，是这一下，不是把梦再解一遍。", true]] },
                            { title: "环境", lines: [[4, "周围推着你的，是这一下。", false]] },
                            { title: "希望/恐惧", lines: [[5, "你盼的和你怕的，都挤在这一下里。", true]] }
                        ],
                        scene: function (sit, close, rows) {
                            if (String(close).includes("身体和心事")) {
                                return "身体和心事是一件事的两面。"
                                    + dreamClause(rows[0]) + "，再加上" + dreamClause(rows[1]) + "，会把身体叫醒。"
                                    + "再往前先做的，是" + dreamClause(rows[2]) + "。"
                                    + "你容易把这一醒写成大事：" + dreamClause(rows[3]) + "。"
                                    + "手还抓着的，是" + dreamClause(rows[4]) + "。"
                                    + "盼和怕还在扒的，是" + dreamClause(rows[5]) + "。"
                                    + "先当身体的，是紧和守夜。先当心事的，是那个被你写大的故事。";
                            }
                            var L = rows.map(dreamLean);
                            return L[0] + L[1] + "再往前，" + L[2] + "今天先动的是，" + L[3] + "周围是，" + L[4] + "你盼的和你怕的，是" + L[5] + close;
                        }
                    };
                }
                if (spread === "celtic" && n >= 10) {
                    return {
                        open: "你先别急着给这个梦下判词。我按这十张的位置说，你听里面那一件就行。",
                        wakeAt: 9,
                        groups: [
                            { title: "现在这一截", lines: [
                                [0, "{sit}，你正站在这一下。", true],
                                [1, "挡住你的，不是梦里那张脸，是这一下。", true]
                            ]},
                            { title: "从哪来，往哪去", lines: [
                                [3, "它从过去这一截长出来。", true],
                                [4, "再往前，先别写成注定。它倾向这一下。", false],
                                [9, "整组走到头，停在这一下。", true]
                            ]},
                            { title: "谁在这局里", lines: [
                                [5, "你自己在这件事里的位置，是这一下。", false],
                                [6, "周围的人、日子，推着的是这一下。", false],
                                [8, "别人眼里的你，和你夜里的自己，差在这一下。", true]
                            ]},
                            { title: "底下那一层", lines: [
                                [2, "你没说出口、夜里却在响的，是这一下。", true],
                                [7, "你盼它变好，又怕它发生，两头都是这一下。", true]
                            ]}
                        ],
                        scene: function (sit, close, rows) {
                            var L = rows.map(dreamLean);
                            return "你正站在，" + L[0] + "挡住的是，" + L[1] + "从过去来的是，" + L[3] + "走到头是，" + L[9] + close;
                        }
                    };
                }
                if (spread === "venus" && n >= 7) {
                    return {
                        open: "你先别急着给这个梦下判词。我按这七张的位置说，你听里面那一件就行。",
                        wakeAt: 5,
                        groups: [
                            { title: "你", lines: [[0, "{sit}，你自己这一侧是这一下。", true]] },
                            { title: "梦里的那一个", lines: [[1, "梦里那个人先别当成他本人。他演的是这一下。", true]] },
                            { title: "中间那一截", lines: [[2, "你和这件事之间，停在这一下。", true]] },
                            { title: "结在哪", lines: [[3, "结打在这一下，不在情节。", true]] },
                            { title: "可以做的", lines: [[4, "今天用得上的，是这一下。", true]] },
                            { title: "走到哪", lines: [[5, "这么走下去，停在这一下。", true]] },
                            { title: "还没说的", lines: [[6, "底下还藏着的，是这一下。", false]] }
                        ],
                        scene: function (sit, close, rows) {
                            var L = rows.map(dreamLean);
                            return "你这一侧，" + L[0] + "梦里那一个演的是，" + L[1] + "中间停在，" + L[2] + "今天用得上的是，" + L[4] + close;
                        }
                    };
                }
                return {
                    open: "你先别急着给这个梦下判词。你听里面这一下就行。",
                    wakeAt: 0,
                    groups: [
                        { title: "这一下", lines: [[0, "{sit}，牌说的就是这一下。", true]] }
                    ],
                    scene: function (sit, close, rows) {
                        return dreamLean(rows[0]) + close;
                    }
                };
            }

            function buildDreamFanwenHtml(questionText) {
                const cards = currentDraws[activeSpread];
                if (!Array.isArray(cards) || !cards.length) return "";
                const rows = cards.map(function (id) { return getWesternRowForCard(id, questionText); });
                if (rows.some(function (r) { return !r || !r.verdict || !r.lean; })) return "";
                const frame = dreamFrame(questionText);
                const plan = dreamSpreadPlan(activeSpread, rows.length);
                const block = function (title, text) {
                    return '<div class="master-section" style="margin-top:1.1rem;">'
                        + '<div class="section-title" style="color:#c4a35a;font-weight:700;margin-bottom:0.5rem;">' + title + '</div>'
                        + '<div class="section-content">' + nlToBrEscaped(text) + '</div></div>';
                };
                const activeItem = document.querySelector("#" + activeSpread + "List .position-item.active");
                const activeId = activeItem && activeItem.dataset.id;
                let activeIndex = cards.indexOf(activeId);
                if (activeIndex < 0) activeIndex = 0;
                let mid = "";
                for (let g = 0; g < plan.groups.length; g++) {
                    const group = plan.groups[g];
                    const lines = group.lines.filter(function (line) { return line[0] === activeIndex; });
                    if (!lines.length) continue;
                    const text = lines.map(function (line) {
                        return dreamCardLine(frame.sit, line[1], rows[line[0]], line[2]);
                    }).join("\n\n");
                    mid += block(group.title, text);
                }
                mid += block("同一幕", plan.scene(frame.sit, frame.close, rows));
                const wakeRow = rows[activeIndex] || rows[plan.wakeAt] || rows[rows.length - 1];
                const wake = dreamWake(questionText, wakeRow, rows[rows.length - 1]);
                return '<div class="card-detail western-question-reading">'
                    + '<div class="master-section" style="margin-top:0.6rem;">'
                    + '<div class="section-title" style="color:#a48e62;font-weight:600;margin-bottom:0.5rem;">【你正在问】</div>'
                    + '<div class="section-content">' + escapeHtmlReading(questionText) + '</div></div>'
                    + '<div class="master-section" style="margin-top:1.1rem;">'
                    + '<div class="section-content">' + nlToBrEscaped(plan.open) + '</div></div>'
                    + mid
                    + block("醒来做", wake)
                    + '</div>';
            }

            /**
             * 西方手写解读：单牌保留「今天就做」；多牌改为「此位提示」+ 底部本阵合读。
             * 占梦按范文读整组：两边连成同一幕，不把单张牌义单独抛出来。
             */
            function paintWestArticle(detailDiv, article, paidOn, cardId, questionText, getMasterReadingFn) {
                const gate = (paidOn || article.finalOnly || article.spreadEssay) ? "" : `
                                <p style="margin:0 0 1.5rem;">
                                    <button type="button" class="west-pay-open" style="background:transparent;color:#c4a35a;border:none;padding:0;cursor:pointer;font:inherit;">付费后看完整的这一篇</button>
                                </p>`;
                const bodyHtml = renderReadingMarkdown(articleToMarkdown(article, paidOn));
                detailDiv.innerHTML = `
                            <div class="card-detail western-question-reading west-article">
                                ${bodyHtml}
                                ${gate}
                            </div>`;
                const payBtn = detailDiv.querySelector(".west-pay-open");
                if (payBtn) {
                    payBtn.addEventListener("click", function () {
                        try { sessionStorage.setItem("laby-west-paid", "1"); } catch (e) {}
                        renderWesternQuestionReading(detailDiv, cardId, questionText, getMasterReadingFn);
                    });
                }
            }

            function applySpreadLive(article, faces, spread, data) {
                if (data && data.article && data.article.open && Array.isArray(data.article.seats) && data.article.action) {
                    const sections = [];
                    for (let i = 0; i < faces.length; i++) {
                        sections.push({
                            nameLine: seatNameLine(faces[i], true),
                            text: data.article.seats[i] || ""
                        });
                    }
                    return {
                        head: article.head,
                        single: false,
                        free: data.article.open,
                        open: data.article.open,
                        chain: data.article.chain || "",
                        action: data.article.action,
                        sections: sections
                    };
                }
                const sections = [];
                const clip = function (text) {
                    const parts = String(text || "").split("。").map(function (s) { return s.trim(); }).filter(Boolean);
                    return parts.slice(0, 2).join("。") + (parts.length ? "。" : "");
                };
                for (let i = 0; i < faces.length; i++) {
                    sections.push({
                        nameLine: seatNameLine(faces[i], true),
                        text: clip(faces[i] && faces[i].singleOpen)
                    });
                }
                const at = focusOf(spread, faces);
                const actI = spread === "hexagram" ? 3 : (spread === "venus" ? 4 : (spread === "celtic" ? 9 : 2));
                let action = faces[actI] && faces[actI].singleAction ? faces[actI].singleAction : "";
                if (spread === "choice" && faces[2] && faces[5]) {
                    action = "人在A。" + (faces[2].singleAction || "") + "人在B。" + (faces[5].singleAction || "");
                }
                const past = faces[at.pastI];
                const now = faces[at.nowI] || faces[0];
                const fore = faces[at.foreI];
                const open = clip(past && past.singleOpen) + "因为" + clip(now && now.singleOpen) + "所以" + clip(fore && fore.singleOpen);
                return {
                    head: article.head,
                    single: false,
                    free: open,
                    open: open,
                    chain: "",
                    action: action,
                    sections: sections
                };
            }

            function renderWesternQuestionReading(detailDiv, cardId, questionText, getMasterReadingFn) {
                const W = window.TarotWesternReading;
                if (!questionText || !W || typeof W.get !== 'function') return false;
                const baseId = cardId.replace('_rev', '');
                const dmyId = baseIdToDmyTarotId(baseId);
                if (!dmyId) return false;
                const upright = !cardId.endsWith('_rev');
                const R = window.TarotQuestionResolve;
                const catId = (R && typeof R.tabToCategory === 'function')
                    ? R.tabToCategory(getCategoryValue())
                    : '感情婚姻';
                let row = W.get(catId || '感情婚姻', questionText, dmyId, upright);
                const q01Essay = q01SingleFor(cardId, questionText);
                if (!row && q01Essay && q01Essay.open && q01Essay.action && String(questionText || "").indexOf("怎么看我") !== -1) {
                    row = {
                        lean: "有",
                        verdict: "有",
                        speak: q01Essay.open,
                        soul: "留",
                        doToday: q01Essay.action,
                        nameZh: "这一张",
                        upright: upright
                    };
                }
                if (!row) {
                    if (typeof W.missing === 'function' && W.missing(catId || '感情婚姻', questionText)) return false;
                    if (typeof W.ensure === 'function') {
                        const token = (detailDiv._westToken = (detailDiv._westToken || 0) + 1);
                        const cid = cardId;
                        const q = questionText;
                        detailDiv.innerHTML = `
                            <div class="card-detail western-question-reading">
                                <div class="section-content">这题的解读正在读进来。</div>
                            </div>`;
                        W.ensure(questionText).then(function () {
                            if (detailDiv._westToken !== token) return;
                            renderWesternQuestionReading(detailDiv, cid, q, getMasterReadingFn);
                        });
                        return true;
                    }
                    return false;
                }
                if (getCategoryValue() === 'dream') {
                    const essay = buildDreamFanwenHtml(questionText);
                    if (essay) {
                        detailDiv.innerHTML = essay;
                        return true;
                    }
                }
                const mr = getMasterReadingFn(cardId, getCategoryValue());
                const cardTitle = mr ? mr.name : (window.tarotData && window.tarotData[cardId] && window.tarotData[cardId].name ? window.tarotData[cardId].name : cardId);
                const ori = upright ? '正位' : '逆位';
                const multi = (spreadPositions[activeSpread] || []).length > 1;
                const isDream = getCategoryValue() === 'dream';
                const actionTitle = isDream ? '【醒来做】' : (multi ? '【此位提示】' : '【今天就做这一步】');
                const actionBody = (!isDream && multi)
                    ? (stripReadingTagLine(row.doToday) || row.doToday)
                    : row.doToday;
                const synthesis = multi && !isDream ? buildSpreadSynthesisHtml(questionText) : '';
                const essay = !isDream && !row.soul && !row.doToday && row.verdict && row.speak;
                const article = (essay || String(questionText || "").indexOf("怎么看我") !== -1) ? buildHowTheySeeArticle(questionText) : null;
                if (String(questionText || "").indexOf("怎么看我") !== -1 && !article) {
                    detailDiv.innerHTML = `<div class="card-detail western-question-reading"><div class="section-content">这张定稿没有读到。</div></div>`;
                    return true;
                }
                let paidOn = false;
                try { paidOn = sessionStorage.getItem("laby-west-paid") === "1"; } catch (e) { paidOn = false; }
                let where = "";
                if (essay && multi && !article) {
                    const activeItem = document.querySelector("#" + activeSpread + "List .position-item.active");
                    const posName = activeItem && activeItem.querySelector(".pos-name")
                        ? String(activeItem.querySelector(".pos-name").textContent || "").trim()
                        : "";
                    if (posName) where = "这一格是" + posName + "。";
                }
                if (article && (essay || String(questionText || "").indexOf("怎么看我") !== -1)) {
                    const paidKey = paidOn ? "1" : "0";
                    const contentSig = (currentDraws[activeSpread] || []).join(",") + "|" + questionText + "|" + activeSpread + "|v23";
                    const sig = contentSig + "|" + paidKey;
                    if (detailDiv.dataset.westSig === sig && detailDiv.querySelector(".west-article")) return true;
                    if (detailDiv._westLive && detailDiv._westLive.sig === contentSig) {
                        paintWestArticle(detailDiv, detailDiv._westLive.article, paidOn, cardId, questionText, getMasterReadingFn);
                        detailDiv.dataset.westSig = sig;
                        return true;
                    }
                    const wantLive = !article.single && String(questionText || "").indexOf("信哪头") !== -1;
                    if (wantLive) {
                        if (detailDiv.dataset.westPending === contentSig) return true;
                        detailDiv.dataset.westPending = contentSig;
                        detailDiv.innerHTML = '<div class="card-detail western-question-reading"><div class="section-content">这一手正在写成一篇。</div></div>';
                        const cardsNow = (currentDraws[activeSpread] || []).slice();
                        const spreadNow = activeSpread;
                        const facesNow = articleFaces(questionText);
                        fetch("/api/tarot-spread", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ question: questionText, spread: spreadNow, cards: cardsNow })
                        }).then(function (res) { return res.json(); }).then(function (data) {
                            if (detailDiv.dataset.westPending !== contentSig) return;
                            const live = applySpreadLive(article, facesNow, spreadNow, data);
                            detailDiv._westLive = { sig: contentSig, article: live };
                            detailDiv.dataset.westPending = "";
                            detailDiv.dataset.westSig = sig;
                            paintWestArticle(detailDiv, live, paidOn, cardId, questionText, getMasterReadingFn);
                        }).catch(function () {
                            if (detailDiv.dataset.westPending !== contentSig) return;
                            const live = applySpreadLive(article, facesNow, spreadNow, { fallback: true });
                            detailDiv._westLive = { sig: contentSig, article: live };
                            detailDiv.dataset.westPending = "";
                            detailDiv.dataset.westSig = sig;
                            paintWestArticle(detailDiv, live, paidOn, cardId, questionText, getMasterReadingFn);
                        });
                        return true;
                    }
                    detailDiv.dataset.westSig = sig;
                    paintWestArticle(detailDiv, article, paidOn, cardId, questionText, getMasterReadingFn);
                    return true;
                }
                if (essay) {
                    const body = paidOn ? row.speak : row.verdict;
                    const gate = paidOn ? "" : `
                                <div class="master-section" style="margin-top:1rem;">
                                    <button type="button" class="west-pay-open" style="background:transparent;color:#c4a35a;border:1px solid rgba(196,163,90,.45);border-radius:999px;padding:0.45rem 0.9rem;cursor:pointer;">付费后看完整的这一篇</button>
                                </div>`;
                    detailDiv.innerHTML = `
                            <div class="card-detail western-question-reading">
                                <div class="detail-cardname">${escapeHtmlReading(cardTitle)}</div>
                                <div class="master-section" style="margin-top:0.6rem;">
                                    <div class="section-title" style="color:#a48e62;font-weight:600;margin-bottom:0.5rem;">【你正在问】</div>
                                    <div class="section-content">${escapeHtmlReading(questionText)}</div>
                                </div>
                                <div class="master-section" style="margin-top:1.1rem;">
                                    <div class="section-content">${nlToBrEscaped(where + body)}</div>
                                </div>
                                ${gate}
                                ${paidOn ? synthesis : ""}
                            </div>`;
                    const payBtn = detailDiv.querySelector(".west-pay-open");
                    if (payBtn) {
