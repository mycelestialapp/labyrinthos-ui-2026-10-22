<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 文档 URL 为 /tarot 时，相对路径脚本/样式须相对站点根解析，否则易全白 -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>圣域塔罗 · 完整六大牌阵 · 大师版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- 全局样式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 18px; /* 基础放大 */
        }
        body {
            background: #0b0510;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            color: #e5d5b3;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
            font-size: 1.1rem;
        }
        /* 宇宙背景（三层星云+星光） */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(96, 58, 128, 0.4) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(180, 130, 50, 0.3) 0%, transparent 45%);
            filter: blur(50px);
            animation: drift 60s infinite alternate ease-in-out;
        }
        .nebula-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(30, 20, 60, 0.5) 0%, transparent 50%),
                        radial-gradient(circle at 90% 20%, rgba(100, 50, 100, 0.3) 0%, transparent 40%);
            filter: blur(70px);
            animation: drift2 50s infinite alternate ease-in-out;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 5% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 15% 60%, #ffe5b0, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 25% 30%, #d4b8ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 35% 80%, #fff2c0, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 45% 20%, #ffd78a, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 55% 70%, #f0d0ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 65% 40%, #ffe4b5, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 75% 90%, #c2b0e6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 85% 50%, #ffeac2, rgba(0,0,0,0));
            background-repeat: repeat;
            opacity: 0.7;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes drift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-3%, -2%); }
        }
        @keyframes drift2 {
            0% { transform: scale(1.2) translate(-2%, 1%); }
            100% { transform: scale(1) translate(2%, -1%); }
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 主圣所 */
        .sanctum {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 1600px;
            background: rgba(6, 2, 12, 0.4);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 60px;
            padding: 3.5rem 3rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 40px 80px -20px black;
        }

        /* 标题区 */
        .sanctum-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .sanctum-header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(3rem, 7vw, 5rem);
            letter-spacing: 10px;
            background: linear-gradient(180deg, #f9e2b0, #b38f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #ffb86b;
            margin-bottom: 0.5rem;
        }
        .sanctum-header .sub {
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: #b6974b;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            border-top: 1px solid rgba(212, 175, 55, 0.5);
            display: inline-block;
            padding: 0.5rem 2.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 40px;
        }

        /* 牌阵导航 */
        .spread-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .spread-tag {
            background: rgba(20,10,25,0.6);
            border: 1px solid #7a6a4b;
            border-radius: 40px;
            padding: 0.7rem 2.2rem;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: #d4b68a;
            cursor: pointer;
            transition: 0.2s;
        }
        .spread-tag:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #b6974b;
        }
        .spread-tag.active {
            background: #b69042;
            color: #0c0712;
            border-color: #ffdd99;
            box-shadow: 0 0 15px #fabc2f;
        }

        /* 问题库入口 */
        .question-sanctum {
            background: rgba(10, 5, 15, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2rem 2.5rem;
            margin-bottom: 3rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .category-selector {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: stretch;
        }
        .category-tabs {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.45rem 0.65rem;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 0.25rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.35) transparent;
        }
        .category-tabs::-webkit-scrollbar {
            height: 4px;
        }
        .category-tabs::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.35);
            border-radius: 4px;
        }
        .category-tab {
            flex: 0 0 auto;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #7a6a4b;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: #c9b896;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .category-tab:hover {
            border-color: #b6974b;
            color: #f3e6d2;
            background: rgba(212, 175, 55, 0.12);
        }
        .category-tab.active {
            background: rgba(182, 144, 66, 0.35);
            border-color: #dbb45c;
            color: #ffefa8;
            box-shadow: 0 0 12px rgba(250, 188, 47, 0.2);
        }
        .category-tab:focus-visible {
            outline: 2px solid #deb887;
            outline-offset: 2px;
        }
        /* 大类标签下方：本类 20 题整块可折叠（非十个独立手风琴） */
        .category-questions-details {
            margin-top: 1rem;
            border: 1px solid rgba(122, 106, 75, 0.5);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }
        .category-questions-details > summary {
            list-style: none;
            cursor: pointer;
            padding: 0.75rem 1.1rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: #e7cf9c;
            user-select: none;
            transition: background 0.2s;
        }
        .category-questions-details > summary::-webkit-details-marker {
            display: none;
        }
        .category-questions-details > summary::before {
            content: '▸';
            display: inline-block;
            margin-right: 0.5rem;
            color: #b6974b;
            transition: transform 0.2s ease;
        }
        .category-questions-details[open] > summary::before {
            transform: rotate(90deg);
        }
        .category-questions-details > summary:hover {
            background: rgba(212, 175, 55, 0.08);
        }
        .category-questions-details > summary:focus-visible {
            outline: 2px solid #deb887;
            outline-offset: -2px;
        }
        .category-questions-body {
            padding: 0 1rem 1.1rem;
            border-top: 1px solid rgba(212, 175, 55, 0.12);
        }
        .question-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .question-option {
            background: rgba(255,255,255,0.02);
            border: 1px solid #5d4d31;
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            font-size: 1.1rem;
            color: #d3c7b0;
            cursor: pointer;
            transition: 0.2s;
        }
        .question-option:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #b6974b;
            color: #ffdfa7;
        }
        .question-option.selected {
            background: #b69042;
            color: #0c0712;
            border-color: #ffdd99;
        }
        .question-more {
            font-size: 1rem;
            color: #a48e62;
            font-style: italic;
            padding: 0.5rem 1.2rem;
            cursor: default;
        }

        /* 牌阵容器 */
        .spread-container {
            display: none;
            margin: 2.5rem 0 3rem;
        }
        .spread-container.active {
            display: block;
        }

        /* 左右分栏布局（适用于所有牌阵） */
        .spread-layout {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
        }
        .position-panel {
            flex: 1.2;
            min-width: 320px;
            background: rgba(10, 5, 15, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .position-panel h3 {
            font-family: 'Cinzel', serif;
            color: #e7cf9c;
            font-size: 1.9rem;
            border-bottom: 1px solid #b5944b;
            padding-bottom: 0.7rem;
            margin-bottom: 2rem;
            letter-spacing: 3px;
        }
        .position-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .position-item {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 1rem 1.3rem;
            border-radius: 40px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            opacity: 0; /* 动画控制 */
            transform: translateY(-20px);
        }
        .position-item:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #b6974b;
        }
        .position-item.active {
            background: rgba(180, 140, 70, 0.2);
            border-color: #e5b95c;
            box-shadow: 0 0 15px rgba(230, 190, 80, 0.3);
        }
        .pos-name {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            color: #ffdfa7;
        }
        .pos-card {
            font-size: 1.15rem;
            color: #d3c7b0;
            font-style: italic;
            background: rgba(0,0,0,0.2);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid #6a5a3a;
        }

        /* 右侧解读区 */
        .reading-panel {
            flex: 2;
            min-width: 350px;
            background: rgba(10, 5, 18, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 2.5rem 2.5rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .reading-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #b5944b;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
        }
        .reading-header i {
            font-size: 2.4rem;
            color: #deb887;
        }
        .reading-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            color: #e7cf9c;
            letter-spacing: 3px;
        }
        .card-detail {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .detail-cardname {
            font-size: 2.5rem;
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #fff1d0, #cbae7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
            margin-bottom: 0.7rem;
        }
        .detail-sub {
            color: #f5c84e;
            font-size: 1.4rem;
            font-style: italic;
            border-left: 4px solid #f5c84e;
            padding-left: 1.2rem;
            margin: 1.2rem 0 1.8rem;
        }
        .detail-desc {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #d3c7b0;
            margin-bottom: 1.8rem;
        }
        .core-lesson {
            background: rgba(26, 17, 33, 0.8);
            border-left: 5px solid #dbb45c;
            padding: 1.3rem 1.8rem;
            border-radius: 30px;
            margin: 1.8rem 0;
        }
        .core-lesson p {
            font-size: 1.25rem;
            color: #ffdfa7;
        }
        .action-today {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 1.2rem 1.8rem;
            border: 1px dashed #ad8f51;
        }
        .action-today i {
            font-size: 2.1rem;
            color: #f5c84e;
        }
        .action-today span {
            font-size: 1.25rem;
            color: #f2e1ba;
        }

        /* 抽牌按钮 */
        .draw-zone {
            text-align: center;
            margin: 2.5rem 0 1.5rem;
        }
        .ritual-btn {
            background: linear-gradient(145deg, #4a3a22, #2a1e12);
            border: 2px solid #dbb45c;
            color: #ffdfa7;
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            padding: 1.3rem 5rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 30px #9e7f45;
            transition: 0.3s;
            letter-spacing: 4px;
            outline: none;
        }
        .ritual-btn:hover {
            background: #5e4b2e;
            box-shadow: 0 0 50px #dbb45c;
            transform: scale(1.03);
        }

        /* 粒子画布 */
        #stardust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* 降临动画 */
        @keyframes cosmicDescent {
            0% { opacity: 0; transform: translateY(-80px) rotate(-10deg) scale(0.7); filter: blur(8px); }
            50% { opacity: 0.9; transform: translateY(5px) rotate(2deg) scale(1.02); filter: blur(0); }
            80% { transform: translateY(-3px) rotate(-1deg) scale(0.99); }
            100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
        }
        .position-item.glow::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            opacity: 0;
            animation: glowPulse 1.2s ease-out forwards;
        }
        @keyframes glowPulse {
            0% { opacity: 0; transform: scale(0.8); }
            40% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        /* 响应式 */
        @media screen and (max-width: 900px) {
            html { font-size: 16px; }
            .spread-layout { flex-direction: column; }
            .category-selector { flex-direction: column; align-items: stretch; }
            .sanctum { padding: 2rem 1.5rem; }
            .ritual-btn { font-size: 1.4rem; padding: 1rem 3rem; }
        }
        @media screen and (max-width: 500px) {
            html { font-size: 14px; }
            .sanctum-header h1 { letter-spacing: 4px; }
            .spread-tag { padding: 0.5rem 1.2rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg">
        <div class="nebula-1"></div>
        <div class="nebula-2"></div>
        <div class="stars"></div>
    </div>
    <canvas id="stardust"></canvas>

    <div class="sanctum">
        <!-- 与 Next 壳同源：/tarot 经 middleware 直达本页时仍可回星云 / 进 React 分层 -->
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-bottom:1.1rem;padding-bottom:0.85rem;border-bottom:1px solid rgba(212,175,55,0.22);font-size:0.82rem;">
            <a href="/hub" style="color:#d4b68a;text-decoration:none;border:1px solid rgba(212,175,55,0.35);border-radius:999px;padding:0.35rem 0.85rem;background:rgba(0,0,0,0.35);">← 星云</a>
            <a href="/tarot?lab=1" style="color:#cbaf7a;text-decoration:none;border:1px solid rgba(212,175,55,0.28);border-radius:999px;padding:0.35rem 0.85rem;background:rgba(0,0,0,0.28);">React 分层版</a>
            <span style="color:#8a7a60;">大师 HTML 原版</span>
        </div>
        <!-- 标题 -->
        <div class="sanctum-header">
            <h1>圣域 · 78秘仪</h1>
            <div class="sub">大阿卡那 + 四元素小牌</div>
        </div>

        <!-- 牌阵导航 -->
        <div class="spread-nav" id="spreadNav">
            <div class="spread-tag active" data-spread="single">单张牌</div>
            <div class="spread-tag" data-spread="celtic">凯尔特十字</div>
            <div class="spread-tag" data-spread="triangle">圣三角</div>
            <div class="spread-tag" data-spread="choice">二择一</div>
            <div class="spread-tag" data-spread="hexagram">六芒星</div>
            <div class="spread-tag" data-spread="trinity">身心灵</div>
            <div class="spread-tag" data-spread="venus">维纳斯</div>
        </div>

        <!-- 问题库 -->
        <div class="question-sanctum">
            <div class="category-selector">
                <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="议题大类">
                    <button type="button" class="category-tab active" role="tab" data-value="love" aria-selected="true">感情婚姻</button>
                    <button type="button" class="category-tab" role="tab" data-value="career" aria-selected="false">事业工作</button>
                    <button type="button" class="category-tab" role="tab" data-value="money" aria-selected="false">财运投资</button>
                    <button type="button" class="category-tab" role="tab" data-value="study" aria-selected="false">学业考试</button>
                    <button type="button" class="category-tab" role="tab" data-value="health" aria-selected="false">身体健康</button>
                    <button type="button" class="category-tab" role="tab" data-value="relation" aria-selected="false">人际关系</button>
                    <button type="button" class="category-tab" role="tab" data-value="child" aria-selected="false">生育子女</button>
                    <button type="button" class="category-tab" role="tab" data-value="choice" aria-selected="false">选择决策</button>
                    <button type="button" class="category-tab" role="tab" data-value="pet" aria-selected="false">宠物</button>
                    <button type="button" class="category-tab" role="tab" data-value="spirit" aria-selected="false">灵性成长</button>
                </div>
                <details class="category-questions-details" id="categoryQuestionsDetails">
                    <summary id="categoryQuestionsSummary">点选上方议题大类，将展开并显示该类 20 条具体问题（可再点此栏收起）</summary>
                    <div class="category-questions-body">
                        <div class="question-grid" id="questionGrid" aria-label="本类 20 条具体问题"></div>
                    </div>
                </details>
            </div>
        </div>

        <!-- 抽牌按钮 -->
        <div class="draw-zone">
            <button class="ritual-btn" id="drawBtn"><i class="fas fa-hand-sparkles"></i> 开启占卜仪式</button>
        </div>

        <!-- 牌阵容器：单张牌 -->
        <div id="spreadSingle" class="spread-container">
            <div class="spread-layout" data-spread="single">
                <div class="position-panel">
                    <h3>今日一牌</h3>
                    <div class="position-list" id="singleList"></div>
                </div>
                <div class="reading-panel">
                    <div class="reading-header"><i class="fas fa-crown"></i><h2>牌义 · 精解</h2></div>
                    <div id="singleDetail" class="card-detail"></div>
                </div>
            </div>
        </div>

        <!-- 牌阵容器：凯尔特十字 -->
        <div id="spreadCeltic" class="spread-container">
            <div class="spread-layout" data-spread="celtic">
                <div class="position-panel">
                    <h3>十方 · 位置</h3>
                    <div class="position-list" id="celticList"></div>
                </div>
                <div class="reading-panel">
                    <div class="reading-header"><i class="fas fa-crown"></i><h2>牌义 · 精解</h2></div>
                    <div id="celticDetail" class="card-detail"></div>
                </div>
            </div>
        </div>

        <!-- 牌阵容器：圣三角 -->
        <div id="spreadTriangle" class="spread-container">
            <div class="spread-layout" data-spread="triangle">
                <div class="position-panel">
                    <h3>时间之流</h3>
                    <div class="position-list" id="triangleList"></div>

                const shuffled = [...allCardIds];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

                return shuffled.slice(0, count);
            }

                });
                spawnParticles(60);
            });

            // ---------- 粒子系统 ----------
            const canvas = document.getElementById('stardust');
            let ctx = canvas.getContext('2d');
            let particles = [];
            let animFrame;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            window.spawnParticles = function(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 1,
                        speedX: (Math.random() - 0.5) * 1.5,
                        speedY: (Math.random() - 0.5) * 1.5,
                        life: Math.random() * 0.8 + 0.2,
                        color: `rgba(255, 215, 140, ${Math.random() * 0.7 + 0.3})`
                    });
                }
                if (animFrame) cancelAnimationFrame(animFrame);
                animateParticles();
            };

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.life -= 0.005;
                    if (p.life <= 0) return;
                    alive = true;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#fabc2f';
