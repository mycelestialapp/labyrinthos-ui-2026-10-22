            function getMasterReading(cardId, category) {
                const isReversed = cardId.endsWith('_rev');
                const baseId = cardId.replace('_rev', '');
                const masterKey = cardKeyMap[baseId];
                
                if (!masterKey) {
                    return null;
                }
                if (!window.tarotMasterReadings) {
                    return null;
                }
                
                const card = window.tarotMasterReadings[masterKey];
                if (!card) return null;
                
                const position = isReversed ? 'reversed' : 'upright';
                const reading = card[position]?.[category];
                if (!reading) return null;
                
                return {
                    name: card.name + (isReversed ? ' · 逆位' : ' · 正位'),
                    ...reading
                };
            }

            // ---------- 牌阵位置定义 ----------
            const spreadPositions = {
                single: ['今日指引'],
                celtic: ['现状', '阻碍', '潜意识', '过去', '未来', '自我', '环境', '希望/恐惧', '他人看法', '结果'],
                triangle: ['过去', '现在', '未来'],
                choice: ['A · 优势', 'A · 劣势', 'A · 结果', 'B · 优势', 'B · 劣势', 'B · 结果'],
                hexagram: ['过去', '现在', '未来', '行动', '环境', '希望/恐惧'],
                trinity: ['身', '心', '灵'],
                venus: ['自己', '对方', '关系', '问题', '建议', '结果', '潜在影响']
            };

            function positionsForSpread(spread) {
                const cat = getCategoryValue();
                if (spread === 'trinity') {
                    if (cat === 'lost') return ['物', '人', '你'];
                    if (cat === 'dream') return ['信号', '白天', '消化'];
                    if (cat === 'pet') return ['症状', '照护', '你'];
                    if (cat === 'health') return ['症状', '节奏', '你'];
                    return ['身', '心', '灵'];
                }
                return spreadPositions[spread] || [];
            }

            function spreadPanelTitle(spread, cat) {
                if (spread === 'single') return '今日一牌';
                if (spread === 'celtic') return '十方 · 位置';
                if (spread === 'triangle') {
                    if (cat === 'lost') return '时间之流 · 找回';
                    if (cat === 'dream') return '时间之流 · 梦信号';
                    return '时间之流';
                }
                if (spread === 'choice') return '二择一 · 抉择';
                if (spread === 'hexagram') {
                    if (cat === 'lost') return '六芒星 · 找回';
                    if (cat === 'dream') return '六芒星 · 梦信号';
                    return '六芒星 · 洞见';
                }
                if (spread === 'trinity') {
                    if (cat === 'lost') return '物／人／你';
                    if (cat === 'dream') return '信号／白天／消化';
                    if (cat === 'pet') return '症状／照护／你';
                    if (cat === 'health') return '症状／节奏／你';
                    return '身心灵 · 三位';
                }
                if (spread === 'venus') {
                    if (cat === 'relation') return '维纳斯 · 人际';
                    return '维纳斯 · 感情';
                }
                return '';
            }

            /** 维纳斯仅感情／人际；错配时自动切回时间之流 */
            function syncSpreadUiForCategory(cat) {
                const venusOk = cat === 'love' || cat === 'relation';
                const venusTag = document.querySelector('.spread-tag[data-spread="venus"]');
                if (venusTag) {
                    if (venusOk) venusTag.removeAttribute('hidden');
                    else venusTag.setAttribute('hidden', '');
                }
                ['single', 'celtic', 'triangle', 'choice', 'hexagram', 'trinity', 'venus'].forEach((spread) => {
                    const containerId = 'spread' + spread.charAt(0).toUpperCase() + spread.slice(1);
                    const h3 = document.querySelector('#' + containerId + ' .position-panel h3');
                    if (h3) h3.textContent = spreadPanelTitle(spread, cat);
                });
                if (!venusOk && activeSpread === 'venus') {
                    const triangleTag = document.querySelector('.spread-tag[data-spread="triangle"]');
                    if (triangleTag) {
                        document.querySelectorAll('.spread-tag').forEach((t) => t.classList.remove('active'));
                        triangleTag.classList.add('active');
                        activeSpread = 'triangle';
                        document.querySelectorAll('.spread-container').forEach((c) => c.classList.remove('active'));

                }
            }

            // 78张牌ID列表（简化，实际需要完整）
            const allCardIds = [
                // 大牌
                'fool','magician','priestess','empress','emperor','hierophant','lovers','chariot',
                'strength','hermit','wheel','justice','hanged','death','temperance','devil',
                'tower','star','moon','sun','judgement','world',
                // 权杖
                'wands1','wands2','wands3','wands4','wands5','wands6','wands7','wands8','wands9','wands10',
                'wands_page','wands_knight','wands_queen','wands_king',
                // 圣杯
                'cups1','cups2','cups3','cups4','cups5','cups6','cups7','cups8','cups9','cups10',
                'cups_page','cups_knight','cups_queen','cups_king',
                // 宝剑
                'swords1','swords2','swords3','swords4','swords5','swords6','swords7','swords8','swords9','swords10',
                'swords_page','swords_knight','swords_queen','swords_king',
                // 星币
                'pentacles1','pentacles2','pentacles3','pentacles4','pentacles5','pentacles6','pentacles7','pentacles8','pentacles9','pentacles10',
                'pentacles_page','pentacles_knight','pentacles_queen','pentacles_king'
            ].flatMap(id => [id, id + '_rev']); // 每个牌正逆位

            // 当前激活的牌阵
            let activeSpread = 'single';
            const currentDraws = {};
            let pinnedQuestion = '';
            const askedQueue = [];

            function hasPinnedDraw() {
                return Array.isArray(currentDraws[activeSpread]) && currentDraws[activeSpread].length > 0;
            }

            function getQuestionText() {
                if (pinnedQuestion) return pinnedQuestion;
                const el = document.querySelector('.question-option.selected');
                return el ? el.textContent.trim() : '';
            }

            function refreshActiveReading() {
                const cards = currentDraws[activeSpread];
                if (Array.isArray(cards) && cards[0]) updateReading(activeSpread, cards[0]);
            }

            function inlineReadingMarkdown(text) {
                return escapeHtmlReading(text).replace(/\*\*([^*]+)\*\*/g, '<strong class="west-name">$1</strong>');
            }

            function renderReadingMarkdown(md) {
                const blocks = String(md || "").split(/\n{2,}/).map(function (block) {
                    return block.trim();
                }).filter(Boolean);
                let html = "";
                for (let i = 0; i < blocks.length; i++) {
                    const line = blocks[i];
                    if (line.indexOf("### ") === 0 && line.indexOf("破局试金石") !== -1) {
                        const next = blocks[i + 1] && blocks[i + 1].indexOf("### ") !== 0 ? blocks[i + 1] : "";
                        html += `<aside class="west-callout"><h3 class="west-kicker">${inlineReadingMarkdown(line.slice(4))}</h3>`;
                        if (next) {
                            html += `<p class="west-flow">${inlineReadingMarkdown(next)}</p>`;
                            i += 1;
                        }
                        html += "</aside>";
                        continue;
                    }
                    if (line.indexOf("### ") === 0) {
                        html += `<h3 class="west-kicker">${inlineReadingMarkdown(line.slice(4))}</h3>`;
                    } else {
                        html += `<p class="west-flow">${inlineReadingMarkdown(line)}</p>`;
                    }
                }
                return html;
            }

            function articleToMarkdown(article, paidOn) {
                if (article.manuscript && article.single) {
                    return ["### 【判断】", "", article.lean, "", article.verdict, "", "### 【这张牌对你说】", "", article.open].join("\n");
                }
                if (article.spreadEssay) {
                    const blocks = ["### 【核心定盘】", "", article.open, ""];
                    for (let i = 0; i < article.sections.length; i++) {
                        const sec = article.sections[i];
                        blocks.push("**" + sec.nameLine + "**", "", sec.text, "");
                    }
                    blocks.push("### 【破局试金石】", "", article.action);
                    return blocks.join("\n");
                }
                if (article.finalOnly) {
                    if (article.single) {
                        return ["### 【核心定盘】", "", article.open, "", "### 【破局试金石】", "", article.action].join("\n");
                    }
                    const blocks = [];
                    for (let i = 0; i < article.sections.length; i++) {
                        const sec = article.sections[i];
                        blocks.push("**" + sec.nameLine + "**", "", "### 【核心定盘】", "", sec.text, "", "### 【破局试金石】", "", sec.action, "");
                    }
                    return blocks.join("\n");
                }
                const parts = ["### 【核心定盘】", "", article.open, ""];
                if (paidOn && !article.single && article.sections && article.sections.length) {
                    if (!article.single) parts.push("### 【命运连线串联】", "");
                    for (let i = 0; i < article.sections.length; i++) {
                        const sec = article.sections[i];
                        parts.push("**" + sec.nameLine + "** " + sec.text, "");
                    }
                    if (article.chain) parts.push(article.chain, "");
                }
                parts.push("### 【破局试金石】", "", article.action);
                return parts.join("\n");
            }

            function renderAskedQueue() {
                /* 抽牌前不展示连问记录，避免像第二套作业 */
            }

            function syncReadingQuestion() {
                const q = getQuestionText();
                document.querySelectorAll('.reading-question').forEach(function (el) {
                    el.textContent = q || '';
                });
            }

            function enterReadingMode() {
                document.body.classList.add('is-reading');
                const bar = document.getElementById('readingBackbar');
                if (bar) bar.hidden = false;
                window.scrollTo(0, 0);
            }

            function leaveReadingMode() {
                document.body.classList.remove('is-reading');
                const bar = document.getElementById('readingBackbar');
                if (bar) bar.hidden = true;
                document.querySelectorAll('.spread-container').forEach(function (c) {
                    c.classList.remove('active');
                });
                delete currentDraws[activeSpread];
                updateFollowupHint();
                window.scrollTo(0, 0);
            }

            function updateFollowupHint() {
                const zone = document.getElementById('followupZone');
                const btn = document.getElementById('drawBtn');
                if (zone) zone.hidden = true;
                if (btn) btn.innerHTML = '<i class="fas fa-hand-sparkles"></i> 抽牌';
                syncReadingQuestion();
            }

            function renderFollowups(category) {
                const box = document.getElementById('followupChips');
                const more = document.getElementById('followupMore');
                if (!box) return;
                const R = window.TarotQuestionResolve;
                const catId = R && typeof R.tabToCategory === 'function' ? R.tabToCategory(category) : '';
                const current = getQuestionText();
                let list = [];
                if (R && typeof R.followupsFor === 'function' && current) {
                    list = R.followupsFor(catId, current) || [];
                }
                box.innerHTML = '';
                list.forEach((chip) => {
                    const el = document.createElement('button');
                    el.type = 'button';
                    el.className = 'followup-chip' + (pinnedQuestion === chip.label ? ' active' : '');
                    el.textContent = chip.label;
                    el.addEventListener('click', () => setPinnedQuestion(chip.label, true));
                    box.appendChild(el);
                });
                if (more) more.hidden = list.length === 0;
                updateFollowupHint();
            }

            function setPinnedQuestion(text, addQueue, fromAsk) {
                pinnedQuestion = String(text || '').trim();
                if (addQueue !== false && hasPinnedDraw() && pinnedQuestion && askedQueue.indexOf(pinnedQuestion) === -1) {
                    askedQueue.push(pinnedQuestion);
                }
                document.querySelectorAll('.question-option').forEach((o) => {
                    o.classList.toggle('selected', o.textContent.trim() === pinnedQuestion);
                });
                document.querySelectorAll('.followup-chip').forEach((o) => {
                    o.classList.toggle('active', o.textContent.trim() === pinnedQuestion);
                });
                const follow = document.getElementById('followupInput');
                if (follow && pinnedQuestion) follow.value = pinnedQuestion;
                const ask = document.getElementById('askInput');
                if (ask && !fromAsk) ask.value = pinnedQuestion;
                const western = window.TarotWesternReading;
                if (pinnedQuestion && western && typeof western.ensure === 'function') western.ensure(pinnedQuestion);
                refreshActiveReading();
                renderFollowups(getCategoryValue());
            }

            // ---------- 随机抽取函数 ----------
            function drawCards(count) {
                const shuffled = [...allCardIds];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled.slice(0, count);
            }

            // ---------- 渲染指定牌阵 ----------
            function renderSpread(spread) {
                const positions = positionsForSpread(spread);
                const count = positions.length;
                if (!currentDraws[spread]) {
                    currentDraws[spread] = drawCards(count);
                }
                const cardIds = currentDraws[spread];
                const listId = spread + 'List';
                const listContainer = document.getElementById(listId);
                if (!listContainer) return;

                listContainer.innerHTML = '';
                cardIds.forEach((cardId, index) => {
                    const item = document.createElement('div');
                    item.className = 'position-item';
                    item.dataset.id = cardId;
                    item.dataset.spread = spread;
                    const cardInfo = window.tarotData?.[cardId] || { name: cardId.replace('_rev', '逆位').replace(/_/g, ' ') };
                    const displayName = cardInfo.name || cardId;
                    item.innerHTML = `<span class="pos-name">${positions[index] || ''}</span><span class="pos-card">${displayName}</span>`;
                    listContainer.appendChild(item);
                });

                if (cardIds.length > 0) updateReading(spread, cardIds[0]);
            }

            // ---------- 更新右侧解读 ----------
            function getCategoryValue() {
                const el = document.querySelector('.category-tab.active');
                return el?.dataset.value || 'love';
            }

            function updateReading(spread, cardId) {
                const detailDiv = document.getElementById(spread + 'Detail');
                const category = getCategoryValue();
                // 當前選中的具體問題（若有）
                const questionText = getQuestionText();

                if (renderWesternQuestionReading(detailDiv, cardId, questionText, getMasterReading)) {
                    return;
                }
                if (questionText) {
                    const td = window.tarotData && window.tarotData[cardId];
                    const cardTitle = (td && td.name) ? td.name : cardId;
                    detailDiv.innerHTML = `
                            <div class="card-detail western-question-reading">
                                <div class="detail-cardname">${escapeHtmlReading(cardTitle)}</div>
                                <div class="master-section" style="margin-top:0.6rem;">
                                    <div class="section-title" style="color:#a48e62;font-weight:600;margin-bottom:0.5rem;">【你正在问】</div>

                                </div>
                                <div class="master-section" style="margin-top:1.1rem;">
                                    <div class="section-title" style="color:#c4a35a;font-weight:700;margin-bottom:0.5rem;">【判断】本题这篇还没写入</div>
                                    <div class="section-content">只走新解读。旧的五段已经拿掉。写到这题这张牌才会出现正文。</div>
                                </div>
                            </div>`;
                    return;
                }

                if (spread !== "single") {
                    const td = window.tarotData && window.tarotData[cardId];
                    const cardTitle = (td && td.name) ? td.name : cardId;
                    detailDiv.innerHTML = `
                            <div class="card-detail western-question-reading">
                                <div class="detail-cardname">${escapeHtmlReading(cardTitle)}</div>
                                <div class="master-section" style="margin-top:1.1rem;">
                                    <div class="section-title" style="color:#c4a35a;font-weight:700;margin-bottom:0.5rem;">【判断】牌阵这篇还没写入</div>

                                </div>
                            </div>`;

                }

                // 优先使用大师级解读
                const masterReading = getMasterReading(cardId, category);
                if (masterReading) {
                    // 宠物：使用健康照护 / 行为情绪 / 关系连结 / 照护建议等专用结构
                    if (category === 'pet') {
                        detailDiv.innerHTML = `
                            <div class="card-detail">
                                <div class="detail-cardname">${masterReading.name}</div>
                                <div class="detail-sub" style="color:#d4af37;font-style:italic;margin:0.8rem 0;">${masterReading.intro || ''}</div>

                                ${questionText ? `
                                <div class="master-section" style="margin-top:1rem;">
                                    <div class="section-title" style="color:#a48e62;font-weight:600;margin-bottom:0.5rem;">【你正在问】</div>

                                ${masterReading.behavior ? `

                                ${masterReading.bond ? `
                                <div class="master-section" style="margin-top:1rem;">

                                    <div class="section-content">${masterReading.bond}</div>

                                ${masterReading.advice ? `
                                <div class="master-section" style="margin-top:1rem;">

                                    <div class="section-content">${masterReading.advice}</div>

                    } else {

                        detailDiv.innerHTML = `

                                </div>

                                ${masterReading.coreInsight ? `<div class="core-lesson"><p>⚜️ 核心启示 · ${masterReading.coreInsight}</p></div>` : ''}
                                ${masterReading.dailyPractice ? `<div class="action-today"><i class="fas fa-feather-alt"></i><span>今日践行 · ${masterReading.dailyPractice}</span></div>` : ''}

                                ${questionText ? (function() {
                                    var categoryLabel = { love:'感情婚姻', career:'事业工作', money:'财运投资', spirit:'灵性成长', study:'学业考试', health:'身体健康', relation:'人际关系', child:'生育子女', choice:'选择决策' }[category] || '此议题';

            // ---------- 切换牌阵 ----------
            const navTags = document.querySelectorAll('.spread-tag');
            navTags.forEach(tag => {

                    navTags.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    activeSpread = this.dataset.spread;

                    // 切换牌阵时，隐藏所有结果区域，等待用户点击"开启"
                    document.querySelectorAll('.spread-container').forEach(container => {
                        container.classList.remove('active');
                    });
                });
            });

            // ---------- 抽牌按钮 ----------
            document.getElementById('drawBtn').addEventListener('click', function() {
                const ask = document.getElementById('askInput');
                const typed = ask ? String(ask.value || '').trim() : '';
                if (typed) setPinnedQuestion(typed, false, true);
                syncSpreadUiForCategory(getCategoryValue());
                // 显示当前牌阵容器
                document.querySelectorAll('.spread-container').forEach(c => c.classList.remove('active'));
                const containerId = 'spread' + activeSpread.charAt(0).toUpperCase() + activeSpread.slice(1);
                document.getElementById(containerId)?.classList.add('active');

                // 重新抽取当前牌阵的牌
                const count = positionsForSpread(activeSpread).length;
                currentDraws[activeSpread] = drawCards(count);
                renderSpread(activeSpread);

                // 触发动画
                const items = document.querySelectorAll(`#${activeSpread}List .position-item`);
                items.forEach((item, index) => {
                    item.style.animation = 'none';
                    item.offsetHeight;
                    item.style.animation = `cosmicDescent 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards`;
                    item.style.animationDelay = `${index * 0.08}s`;
                    setTimeout(() => {
                        item.classList.add('glow');
                        setTimeout(() => item.classList.remove('glow'), 1200);
                    }, index * 80 + 300);
                });
                spawnParticles(60);
                askedQueue.length = 0;
                if (pinnedQuestion) askedQueue.push(pinnedQuestion);
                const input = document.getElementById('followupInput');
                if (input && pinnedQuestion) input.value = pinnedQuestion;
                updateFollowupHint();
                enterReadingMode();
            });

            document.getElementById('backToAskBtn').addEventListener('click', function () {
                leaveReadingMode();
            });

            // ---------- 粒子系统 ----------
            const canvas = document.getElementById('stardust');
            let ctx = canvas.getContext('2d');
            let particles = [];
            let animFrame;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            window.spawnParticles = function(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 1,
                        speedX: (Math.random() - 0.5) * 1.5,
                        speedY: (Math.random() - 0.5) * 1.5,
                        life: Math.random() * 0.8 + 0.2,
                        color: `rgba(255, 215, 140, ${Math.random() * 0.7 + 0.3})`
                    });
                }
                if (animFrame) cancelAnimationFrame(animFrame);
                animateParticles();
            };

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.life -= 0.005;
                    if (p.life <= 0) return;
                    alive = true;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#fabc2f';
                    ctx.fill();
                });
                if (alive) {
                    animFrame = requestAnimationFrame(animateParticles);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

                    '当下我最该放下的是什么？',
                    '宇宙此刻最想让我看见的人生方向是什么？',
                ],
            };

            const CATEGORY_LABEL_ZH = {
                love: '感情婚姻',
                career: '事业工作',
                money: '财运投资',
                study: '学业考试',
                health: '身体健康',
                pet: '宠物',
                relation: '人际关系',
                travel: '出行迁居',
                legal: '官司法律',
                child: '生育子女',
                lost: '失物寻找',
                choice: '选择决策',
                dream: '占梦境',
                fengshui: '占风水',
                proxy: '代人问卜',
                spirit: '灵性成长',
                other: '其他',
                psyche: '心理疏导',
                advice: '人生建议',
            };

            const categoryTabs = document.getElementById('categoryTabs');
            const questionGrid = document.getElementById('questionGrid');
            const questionFilterTabs = document.getElementById('questionFilterTabs');
            const categoryQuestionsSummary = document.getElementById('categoryQuestionsSummary');
            const categoryQuestionsDetails = document.getElementById('categoryQuestionsDetails');
            let exampleFilterId = 'hot';
            let exampleFilterCat = '';

            function groupsForFilter(groups, filterId, filters, catId) {
                const tab = (filters || []).find((t) => t.id === filterId) || (filters || [])[0];
                if (tab && tab.surface && tab.surface.length) {
                    return [{ categoryId: catId, label: '高频', surface: tab.surface.slice() }];
                }
                if (!groups || !groups.length) return [];
                if (tab && (tab.groupLabels || []).length) {
                    const want = new Set(tab.groupLabels);
                    return groups.filter((g) => want.has(g.label));
                }
                return groups.slice();
            }

            function renderExampleFilters(category, filters) {
                if (!questionFilterTabs) return;
                if (!filters || filters.length < 2) {
                    questionFilterTabs.classList.remove('is-on');
                    questionFilterTabs.innerHTML = '';
                    return;
                }
                questionFilterTabs.classList.add('is-on');
                questionFilterTabs.innerHTML = filters.map((t) => {
                    const on = t.id === exampleFilterId ? ' active' : '';
                    const sel = t.id === exampleFilterId ? 'true' : 'false';
                    return `<button type="button" class="question-filter-tab${on}" role="tab" data-filter="${t.id}" aria-selected="${sel}">${t.label}</button>`;
                }).join('');
                questionFilterTabs.querySelectorAll('.question-filter-tab').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        exampleFilterId = btn.getAttribute('data-filter') || 'hot';
                        renderQuestions(category);
                    });
                });
            }

            function renderQuestions(category) {
                const R = window.TarotQuestionResolve;
                const catId = R && typeof R.tabToCategory === 'function' ? R.tabToCategory(category) : '';
                const groups = R && typeof R.groups === 'function' ? R.groups(catId) : null;
                const filters = (R && typeof R.filters === 'function') ? R.filters(catId) : [];
                if (exampleFilterCat !== category) {
                    exampleFilterCat = category;
                    exampleFilterId = 'hot';
                }
                const hasFilters = !!(filters && filters.length >= 2);
                renderExampleFilters(category, hasFilters ? filters : []);
                let html = '';
                // 西方大师页只认西方题库；禁止回退到页面内嵌的旧国内 questionBank。
                const rows = (groups && groups.length)
                    ? (hasFilters ? groupsForFilter(groups, exampleFilterId, filters, catId) : groups)
                    : [];
                const seen = new Set();
                const qs = [];
                rows.forEach((g) => {
                    (g.surface || []).forEach((q) => {
                        if (!q || seen.has(q)) return;
                        seen.add(q);
                        qs.push(q);
                    });
                });
                qs.forEach((q) => {
                    html += `<div class="question-option">${q}</div>`;
                });
                questionGrid.innerHTML = html;
                const label = CATEGORY_LABEL_ZH[category] || category;
                if (categoryQuestionsSummary) {
                    if (hasFilters) {
                        categoryQuestionsSummary.textContent = `不会写？点开看「${label}」的例子，先选一类（可再点此栏收起）`;
                    } else {
                        const n = (groups || []).reduce((s, g) => s + ((g.surface || []).length), 0) || 20;
                        categoryQuestionsSummary.textContent = `不会写？点开看「${label}」的 ${n} 条例子（可再点此栏收起）`;
                    }
                }
                document.querySelectorAll('.question-option').forEach((opt) => {
                    opt.addEventListener('click', function () {
                        setPinnedQuestion(this.textContent.trim(), true);
                    });
                });
                renderFollowups(category);
            }

            categoryTabs.querySelectorAll('.category-tab').forEach((tab) => {
                tab.addEventListener('click', () => {
                    categoryTabs.querySelectorAll('.category-tab').forEach((t) => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    const val = tab.dataset.value;
                    syncSpreadUiForCategory(val);
                    renderQuestions(val);
                    renderFollowups(val);
                    refreshActiveReading();
                });
            });

            syncSpreadUiForCategory(getCategoryValue());

            document.getElementById('followupAskBtn')?.addEventListener('click', () => {
                const input = document.getElementById('followupInput');
                const text = input ? String(input.value || '').trim() : '';
                if (!text) return;
                setPinnedQuestion(text, true);
                if (input) input.value = '';
            });
            document.getElementById('followupInput')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('followupAskBtn')?.click();
                }
            });

            function bootFollowups() {
                // 必须等西方题库挂上，否则会短暂/长期画出旧国内预题。
                if (!window.TarotQuestionResolve || !window.TarotQuestionWestern) {
                    setTimeout(bootFollowups, 60);
                    return;
                }
                renderQuestions(getCategoryValue());
                renderFollowups(getCategoryValue());
            }
            bootFollowups();

            const askInput = document.getElementById('askInput');
            function pinFromAsk() {
                const text = askInput ? String(askInput.value || '').trim() : '';
                if (text) setPinnedQuestion(text, true, true);
            }
            askInput?.addEventListener('input', () => {
                pinnedQuestion = String(askInput.value || '').trim();
                document.querySelectorAll('.question-option').forEach((o) => {
                    o.classList.toggle('selected', o.textContent.trim() === pinnedQuestion);
                });
            });
            askInput?.addEventListener('change', pinFromAsk);
            askInput?.addEventListener('blur', pinFromAsk);
            askInput?.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                pinFromAsk();
                document.getElementById('drawBtn')?.click();
            });

            categoryQuestionsDetails?.addEventListener('toggle', () => {
                if (!categoryQuestionsDetails.open || !categoryQuestionsSummary) return;
                const empty = !questionGrid || questionGrid.innerHTML.trim() === '';
                if (empty) {
                    renderQuestions(getCategoryValue());
                }
            });

            // 初始不渲染，等用户点击抽牌按钮后再显示
        })();
    </script>

    <script>
        (function () {
            var W = window.TarotQuestionWestern;
            var R = window.TarotQuestionResolve;
            if (!W || !R) return;
            // 本页预题只走西方题库，不再回退东方/国内 Resolve 题表。
            R.groups = function (id) { return (W.groups && W.groups[id]) || []; };
            R.filters = function (id) { return (W.filters && W.filters[id]) || []; };
            R.followups = function (id) {
                var row = W.followups && W.followups[id];
                return (row && row.length) ? row : [];
            };
        })();
    </script>
    <script>
        (function () {
            var host = location.hostname;
            if (host !== "localhost" && host !== "127.0.0.1") return;
            var last = "";
            var inflight = false;
            function tick() {
                if (inflight) return;
                inflight = true;
                var ac = typeof AbortController !== "undefined" ? new AbortController() : null;
                var timer = setTimeout(function () { if (ac) ac.abort(); }, 1500);
                fetch("/tarot-dev-stamp.txt?t=" + Date.now(), {
                    cache: "no-store",
                    signal: ac ? ac.signal : undefined
                })
                    .then(function (r) { return r.ok ? r.text() : ""; })
                    .then(function (t) {
                        t = String(t || "").trim();
                        if (!t || t.charAt(0) === "<") return;
                        if (last && t !== last) {
                            location.reload();
                            return;
                        }
                        last = t;
                    })
                    .catch(function () {})
                    .then(function () {
                        clearTimeout(timer);
                        inflight = false;
                    });
            }
            tick();
            setInterval(tick, 2500);
        })();
    </script>
